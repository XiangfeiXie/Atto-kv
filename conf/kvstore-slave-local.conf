port 2001
network proactor
maxclients 1000
loglevel info
persistence none

# RDMA full sync
rdma_sync on
rdma_role slave
master_port 2000
rdma_master_ip 192.168.30.137
rdma_master_port 2100
fullsync_transport rdma
expire off
