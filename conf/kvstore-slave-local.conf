# =============================================================================
# kvstore-slave-local.conf — Slave (local test)
# 本机一机两实例测试用: 配 Slave，连 kvstore-master-local.conf 的 Master。
# =============================================================================
port 2001
network proactor
maxclients 1000
persistence none

# Replication
repl_role slave          # off | master | slave（总开关）
incr_sync on             # on → 全量后 PSYNC 流式; off → 仅一次全量
master_port 2000         # 指回本机 Master 的主端口（PSYNC 握手，+FULLRESYNC 驱动全量）
fullsync_master_ip 192.168.30.137   # 数据面地址: 须为 Master 实际网卡 IP（RDMA CM 无 loopback, 127.0.0.1 仅 sendfile 可用）
fullsync_port 2100       # 须等于 Master 的 fullsync_port（数据端口, 两种传输共用）
fullsync_transport rdma  # rdma | sendfile（须与 Master 一致）
expire off
