# =============================================================================
# kvstore-slave.conf  —  从机配置
#
# 启动:  sudo ./kvstore conf/kvstore-slave.conf
# =============================================================================

# ---- 服务端口 ----
port 2002

# ---- 网络模型 (reactor | proactor | ntyco) ----
network proactor

# 最大客户端连接数
maxclients 10000

# ---- 日志级别 (debug | info | warn | error) ----
loglevel info

# ---- 持久化 (none | rdb | aof) ----
persistence none

# ---- RDMA + eBPF 主从同步 ----
rdma_sync on
rdma_role slave
rdma_provider verbs

# 主机 RDMA 全量同步连接地址（指向 master）
rdma_master_ip   192.168.30.135
rdma_master_port 2100

# TCP 增量同步端口（必须与主机一致）
incr_port 6382

# ---- XDP 热路径加速 ----
# 从机不需要 XDP（XDP 仅在接受客户端 GET 请求的主机上使用）
xdp no
xdp_iface lo
