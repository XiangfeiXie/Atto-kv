# =============================================================================
# kvstore-master.conf  —  RDMA/libfabric 复制主机配置
#
# 适用:
#   - master 提供客户端写入
#   - slave 通过 RDMA fullsync 拉取快照，再进入 XDP/AF_XDP 增量模式
# =============================================================================

port 2000
network proactor
maxclients 10000
loglevel info

persistence aof
threads 1            
cpu_pin auto

rdma_sync on
rdma_role master
rdma_provider tcp       # 本地 SKB/XDP 功能测试优先使用 tcp provider
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100

xdp_repl on
xdp_repl_mode skb
xdp_repl_ifname vethm
xdp_repl_queue 0
xdp_repl_udp_port 6383
xdp_repl_zero_copy off
xdp_repl_batch 64
xdp_repl_mtu 1400


