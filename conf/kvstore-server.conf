# =============================================================================
# kvstore-server.conf  —  专用服务器（独占整机，QPS 优先）
#
# 适用:
#   - 物理机或 dedicated VM，整台机器只跑这一个 KV
#   - 想要最大吞吐，不在意"礼貌让步"
#   - NIC 至少 10 GbE，否则 CPU 早就打不满
#
# 行为:
#   - threads 0  → 自动 = nproc - 1（在 16c 上 = 15 worker）
#   - cpu_pin auto → worker 钉到 core 1..N-1，core 0 留给 IRQ/softirq
#   - persistence aof → 双轨持久化
#   - 启动后 banner 自动显示 cgroup 配额是否更紧
#
# 启动:
#   sudo ./build/kvstore conf/kvstore-server.conf
#   （sudo 是为了 XDP / RDMA / IRQ 绑核，纯 KV 用户态不需要）
# =============================================================================

port 2000

# 高吞吐 io_uring 路径（带 multishot accept/recv + DEFER_TASKRUN）
network proactor

maxclients 65536
loglevel info

# AOF + RDB 双轨。AOF appendfsync 在 persistence.c 默认 everysec，
# 不会卡 SSD IOPS。BGSAVE 走 fork+io_uring，不阻塞主路径
persistence aof

# threads 0 = auto: 在 16c 服务器 = 15 worker，6c 笔记本 = 5 worker
# 容器里若 cpu.max=4 则自动 cap 在 3 worker
threads 0

# 绑核。io_uring + DEFER_TASKRUN 闲时仍 sleep，绑了核也不抢死
cpu_pin auto

# 复制：默认开主，slave 用 kvstore-slave.conf
rdma_sync off
rdma_role master

# eBPF/XDP 加速器：默认开启
xdp yes
xdp_iface lo
sockmap off
