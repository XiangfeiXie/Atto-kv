# =============================================================================
# kvstore.conf — 配置参考（Config Reference）
#
# 本文件是 kvstore 全部配置项的完整说明，展示每项的含义、取值与默认值。
# 不直接用于启动；用于两机主从测试请使用 kvstore-master.conf / kvstore-slave.conf。
# 配置格式:  `<key> <value>`，空行与 `#` 开头的行忽略。
# 布尔取值:  on | off
#
# 全局结构一览:
#   1.  服务 Service
#   2.  持久化 Persistence（含内存池 kv_pool）
#   3.  复制 Replication（repl_role 一档收敛主/从 + 全量/增量）
#   4.  其他 Other（expire / latency_histogram）
# =============================================================================

# ── 1. 服务 Service ─────────────────────────────────────────────────────────

# port <1-65535>                    默认 6379
#   客户端连接监听端口。Master 上同时是 Slave 的 PSYNC 握手端口（+FULLRESYNC 驱动全量）。
# port 6379

# network <reactor|proactor>        默认 reactor
#   网络引擎。reactor = epoll 事件驱动；proactor = io_uring(SQPOLL+provided buffer)。
#   注意: 仅 reactor / proactor 两种；ntyco 为保留引擎，当前不使用。
# network reactor

# maxclients <int>                  默认 10000
#   最大客户端连接数。
# maxclients 10000

#   日志级别。

# ── 2. 持久化 Persistence ───────────────────────────────────────────────────

# persistence <none|rdb|aof>        默认 none
#   none = 不持久化；rdb = RDB 快照；aof = AOF 追加日志。
# persistence none

# kv_pool <on|off>                  默认 on
#   数据域内存池（kv_pool）开关，控制 dict entry 的整块分配走哪里：
#     on  — entry 走自研内存池（16B 档位超块切分，主线程专属）；
#     off — entry 直接走底座 malloc/free（jemalloc 或 glibc）。
#   池代码恒编译进来，本项是唯一开关 —— 一个二进制即可覆盖 有池/无池 两形态
#   （基准对比、线上定位问题不必再换二进制）。
#   注意两种"到 malloc"语义不同: 本项 off 是 entry 从不进池；on 时池对
#   超过 KV_POOL_CLASS_MAX(2048) 的大对象另有兜底（直接底座分配，不经池内存）。
#   须在启动阶段生效（引擎初始化即注入），运行中不可切换。
# kv_pool on

# aof_fsync_policy <always|everysec> 默认 everysec
#   AOF 刷盘策略（persistence=aof 时生效）。everysec 每秒 fsync；always 每条 fsync。
# aof_fsync_policy everysec

# ── 3. 复制 Replication ─────────────────────────────────────────────────────

# repl_role <off|master|slave>      默认 off
#   复制总开关:
#     off    — 不启用复制，纯单机模式（不挂复制回调、不 fork、不监听任何
#               复制端口，服务主循环零复制开销）。
#     master — 开启全量 + （incr_sync on 时）增量:
#                · 全量: PSYNC 握手判定 +FULLRESYNC 后，传输子进程在
#                  fullsync_listen_ip:fullsync_port 上用 fullsync_transport
#                  方式推 RDB；
#                · 增量: 主端口上做 PSYNC 握手，写命令实时写入 1MB backlog 并
#                  push 给已入流的 Slave，按 offset 断线续传。
#     slave  — 开启全量 + （incr_sync on 时）增量:
#                启动先跑一次全量（fullsync_transport，须与 Master 一致）建快照，
#                随后连 Master 主端口发 PSYNC <快照 offset> 流式追平 backlog；
#                +FULLRESYNC 则重做全量；断线由 repl tick 按 offset 自动重连。
# repl_role off

# incr_sync <on|off>                默认 off
#   增量同步开关。on → PSYNC 流式 + 断线续传；off → 仅全量:
#     · master: 不建 backlog、不传播；主端口仍挂 PSYNC 探测（收到 PSYNC 一律回 +FULLRESYNC 驱动全量）；
#     · slave : 只做一次全量加载快照，之后结束，不建增量链路。
#   用于对比全量传输性能等无需增量的场景。
# incr_sync on

# fullsync_transport <rdma|sendfile>  默认 rdma
#   全量同步传输方式（两种，二选一，Master/Slave 须一致）:
#     rdma     — RDMA verbs (RoCE / SoftRoCE) 传输，需要 RDMA 网卡。
#     sendfile — TCP sendfile() 零拷贝传输，无需 RDMA。
#   传输代码两套并存，供性能对比（详见 test/bench 下的 fullsync 基准脚本）。
# fullsync_transport rdma

# fullsync_listen_ip <ip>           默认 0.0.0.0
#   【仅 Master】全量数据端口绑定地址，应设为 Master 的实际网卡 IP（RDMA CM 用）。
# fullsync_listen_ip 0.0.0.0

# fullsync_port <1-65535>           默认 2101
#   全量同步专用数据端口：sendfile 与 rdma 两种传输共用
#   （Master 传输子进程 bind，Slave 的 fullsync_port 须与此一致）。
# fullsync_port 2101

# fullsync_master_ip <ip>           默认 127.0.0.1
#   【仅 Slave】Master 的地址。
# fullsync_master_ip 127.0.0.1

# master_port <1-65535>             默认 6379
#   【仅 Slave】Master 主服务端口（PSYNC 握手，+FULLRESYNC 驱动全量）。
# master_port 6379

# ── 4. 其他 Other ───────────────────────────────────────────────────────────

# expire <on|off>                   默认 off
#   主动过期开关（惰性过期始终生效）。on = 事件循环中周期性随机采样删除过期键。
# expire off

# latency_histogram <on|off>        默认 off
#   请求延迟直方图。on = 开启，INFO stats 输出 p50/p99/p999。
# latency_histogram off
