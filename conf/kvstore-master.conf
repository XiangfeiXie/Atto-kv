# =============================================================================
# kvstore-master.conf  —  主机配置
#
# 启动:  sudo ./kvstore conf/kvstore-master.conf
# =============================================================================

# ---- 服务端口 ----
port 2000

# ---- 网络模型 (reactor | proactor | ntyco) ----
network proactor

# ---- 日志级别 (debug | info | warn | error) ----
loglevel info

# ---- 存储引擎 (array | rbtree | hash | skiptable) ----
engine skiptable

# ---- 持久化 (none | rdb | aof) ----
persistence none

# ---- RDMA + eBPF 主从同步 ----
rdma_sync off
rdma_role master
rdma_provider verbs

# 主机 RDMA 全量同步监听地址
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# TCP 增量同步监听端口
incr_port 6382
