# =============================================================================
# kvstore.conf  —  配置参考（列出所有可配置项）
#
# 用法:
#   ./kvstore conf/kvstore.conf       指定配置文件启动
#   ./kvstore                          默认加载 conf/kvstore.conf
#
# 实际部署时请按节点角色使用:
#   conf/kvstore-master.conf           主机
#   conf/kvstore-slave.conf            从机
# =============================================================================


# =========================== 服务端口 =========================================
#
# 客户端连接端口（默认: 6379）
port 2000


# =========================== 网络 I/O 模型 ====================================
#
#   reactor   — epoll（默认）
#   proactor  — io_uring（高并发推荐）
#   ntyco     — 协程
network reactor

# 最大客户端连接数（默认: 10000，范围: 64-65536）
maxclients 10000


# =========================== 日志级别 =========================================
#
#   debug | info | warn | error（默认: info）
loglevel debug


# =========================== 持久化 ===========================================
#
#   none  — 关闭
#   rdb   — RDB 快照（dump.rdb）
#   aof   — AOF + RDB 双开（appendonly.aof + dump.rdb）
#   默认: aof
persistence aof


# =========================== RDMA + eBPF 主从同步 ==============================
#
# 全量同步: fork() COW 快照 → RDMA (libfabric) 发送
# 增量同步: eBPF uprobe 捕获写命令 → TCP 传输
#
# 总开关: on | off（默认: off）
rdma_sync on

# 节点角色: master | slave（默认: master）
rdma_role master

# libfabric provider: tcp | verbs | sockets（默认: tcp）
#   tcp     — TCP 模拟（无需 RDMA 硬件，开发调试用）
#   verbs   — 内核 RDMA 栈（需 Soft-RoCE 或 InfiniBand 硬件）
rdma_provider verbs

# ---- 以下按角色二选一 ----

# 主机 RDMA 监听地址（仅 master）
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# 从机 RDMA 连接地址（仅 slave）
# rdma_master_ip   192.168.30.135
# rdma_master_port 2100


# =========================== TCP 增量同步端口 ==================================
#
# 主机在此端口监听从机的增量连接（需与从机一致）
# 默认: 6382
incr_port 6382


# =========================== XDP 热路径加速 =====================================
#
# 利用 eBPF XDP 在网卡驱动层拦截 GET 请求，热缓存命中时原地构造 RESP 回包。
#
# 已实现（Phase 3 完整版）:
#   命中热缓存的 GET → XDP 原地构造 RESP bulk-string 回包并 XDP_TX 返回，
#   完全绕过内核 TCP 栈，延迟从 ~15μs 降至 ~2μs。
#   未命中或非 GET → XDP_PASS，由 kvstore 进程正常处理。
#
# 限制（生产环境注意事项）:
#   - 仅标准 IPv4（ihl=5），含 IP options 的包自动 fallback
#   - 绕过内核 TCP 状态机（无重传/窗口管理），适用于 demo/benchmark
#   - value 长度上限 256 字节，超长 key 自动 fallback 到 kvstore
#   - 需要 CAP_NET_ADMIN 权限（或以 root 运行）
#   - 虚拟机/loopback 接口自动降级为 SKB 模式
#   - 编译产物 xdp_kvs.kern.o 须与 kvstore 可执行文件在同一目录
#
# 总开关: yes | no（默认: no）
xdp no

# 挂载 XDP 程序的网卡名称（默认: lo）
# 生产环境改为实际外网网卡，例如 eth0、ens3、enp0s3
xdp_iface lo
