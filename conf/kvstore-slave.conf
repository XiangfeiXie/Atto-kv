# =============================================================================
# kvstore-slave.conf  —  Slave 配置文件
#
# 功能:
#   - 提供 Redis 协议只读服务（端口 2000）
#   - 启动时通过 RDMA 从 master 拉取全量快照
#   - 运行时通过 TCP + eBPF 接收增量写命令
#
# 部署:
#   - 在从机虚拟机上运行
#   - 需要 root 权限（eBPF 需要）
#   - 启动命令: sudo ./build/kvstore conf/kvstore-slave.conf
#   - 确保能连接到 master 的 IP 和端口
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口（与 master 不同）
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（纯内存模式）

# ── 线程配置 ──────────────────────────────────────────────────────────────
threads 1                # 工作线程数（单线程模式）
cpu_pin auto             # CPU 亲和性：auto 自动绑定

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role slave          # 角色：slave
rdma_provider verbs      # libfabric provider（必须与 master 一致）
rdma_master_ip 192.168.30.135   # Master IP 地址（修改为实际 master IP）
rdma_master_port 2100    # Master RDMA 端口

# 说明:
#   - rdma_master_ip 必须修改为实际 master 虚拟机的 IP 地址
#   - rdma_provider 必须与 master 保持一致（tcp 或 verbs）
#   - 启动时会自动连接 master 并拉取全量数据

# ── 增量同步配置（TCP + eBPF）─────────────────────────────────────────────
incr_repl on              # 启用增量同步
incr_repl_master_port 6483  # Master 的 TCP 复制端口（slave 连接到此端口）

# 传输方式说明:
#   【TCP 模式】(Phase 9.1)
#     - 使用标准 TCP socket 连接到 master
#     - Slave 主动连接到 master_ip:incr_repl_master_port
#     - 自动重连机制：连接断开后每 3 秒重试
#     - 自动启用 TCP_NODELAY 减少延迟
#     - 自动设置 2MB 发送/接收缓冲区
#
#   【性能特点】
#     - eBPF 过滤器：只接收写命令（SET/DEL/HSET 等）
#     - TCP 可靠性：内核自动处理重传、流控、拥塞控制
#     - 延迟：1-3ms（本地网络）
#     - 吞吐量：300-500 MB/s（取决于 TCP 调优）
#     - 支持断线重连增量恢复

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 修改 rdma_master_ip 为 master 虚拟机的实际 IP
# 2. 确保 master 已启动并监听 2100 (RDMA) 和 6483 (TCP 复制) 端口
# 3. 确保网络连通：ping <master_ip>
# 4. 确保防火墙允许端口 2100, 6483
# 5. 使用 sudo 启动：sudo ./build/kvstore conf/kvstore-slave.conf
