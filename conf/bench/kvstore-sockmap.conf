# sockmap 流层可观测基准: 无持久化, 无主从, proactor + sockmap stream verdict
# sockops 程序挂在 cgroup v2; sk_skb stream_verdict 挂在 sockhash
# Phase 2.1: stream_verdict 仅作 SK_PASS + 计数器, 业务行为不变
port 2000
network proactor
maxclients 10000
loglevel error
persistence none
rdma_sync off
rdma_role master
xdp no
sockmap yes
