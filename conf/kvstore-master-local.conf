# =============================================================================
# kvstore-master-local.conf — Master (local test)
# 本机一机两实例测试用: 配 Master，另起 kvstore-slave-local.conf 作 Slave。
# =============================================================================
port 2000
network proactor
maxclients 1000
persistence rdb

# Replication
repl_role master        # off | master | slave（总开关）
incr_sync on            # on → PSYNC 流式; off → 仅全量
fullsync_listen_ip 192.168.30.137   # 本机回环; 跨机改成实际网卡 IP
fullsync_port 2100             # 全量数据端口: sendfile 与 rdma 共用
fullsync_transport sendfile    # rdma | sendfile（本机测 sendfile 无需网卡）
expire off
