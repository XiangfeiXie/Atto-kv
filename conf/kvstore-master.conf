# =============================================================================
# kvstore-master.conf  —  主机配置示例（RDMA 全量 + eBPF 增量同步）
#
# 启动:  ./kvstore kvstore-master.conf
# =============================================================================

# ---- 服务端口 ----
port 2000

# ---- 网络模型 ----
network proactor

# ---- 日志级别 ----
loglevel info

# ---- 存储引擎 ----
engine skiptable

# ---- 持久化 ----
persistence aof

# ---- RDMA + eBPF 主从同步（全量 RDMA + 增量 TCP）----
rdma_sync off
rdma_role master
rdma_provider verbs
rdma_bind_ip      0.0.0.0      # 监听所有网卡，等待从机 RDMA 连接
rdma_bind_port    2100          # RDMA 全量同步监听端口
rdma_master_ip    192.168.30.135
rdma_master_port  2100

# ---- TCP 增量同步（eBPF 捕获 + TCP 传输）----
incr_port 6382                  # 增量同步 TCP 监听端口
