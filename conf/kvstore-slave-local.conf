# =============================================================================
# kvstore-slave-local.conf  —  Slave 本地测试配置
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2001                # Redis 协议服务端口（与 master 不同）
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（纯内存模式）

# ── 线程配置 ──────────────────────────────────────────────────────────────
threads 1                # 工作线程数（单线程模式）
cpu_pin auto             # CPU 亲和性：auto 自动绑定

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role slave          # 角色：slave
rdma_provider verbs      # 本地测试使用 verbs provider
rdma_master_ip 127.0.0.1 # Master IP 地址
rdma_master_port 2100    # Master RDMA 端口

# ── 增量同步配置（TCP + eBPF）─────────────────────────────────────────────
incr_repl on              # 启用增量同步
incr_repl_master_port 6483  # Master 的 TCP 复制端口
