# =============================================================================
# kvstore-local.conf  —  本机 6c 笔记本：3 worker，KV 占后 3 核
#
# 用途:
#   - 6c 笔记本 / 本地开发机
#   - 3 worker 钉到 cores 3,4,5；前 3 核 (0,1,2) 留给 IDE / Cascade / softirq
#   - 既能验证多 worker 并发（多 key 锁、BLPOP 跨 worker），
#     又不会把整机吃满
#
# 启动:
#   ./build/kvstore conf/kvstore-local.conf
#
# 验证礼貌:
#   开两个终端：一个跑这台 KV + redis-benchmark，
#   另一个跑 stress-ng -c 3 --cpu-method matrixprod 验证前 3 核没被抢
# =============================================================================

port 2000

# 高并发 io_uring 路径（多 worker 并发验证目标）
network proactor

maxclients 10000
loglevel info

# 本机调试默认开 AOF，验证持久化路径
persistence aof

# 显式 3 worker（不用 auto，确保数量稳定可对比）
threads 3

# 手动钉到后 3 核：0,1,2 给 IDE/softirq；3,4,5 给 KV
# 与 cpu_pin auto 的 (i+1)%6 不同，这里明确"靠后 3 核"
cpu_pin 3,4,5

# 复制 / 加速器关闭，本机简单跑
rdma_sync off
xdp       no
sockmap   no

# Phase 10 — lock-free seqlock fast-path 短键热路径缓存
# 4096 buckets × 512B = 2 MB；read 端零锁，热点 GET 跳过 dict_find
# 关闭时所有 GET 走原 32-shard rwlock 路径
fastpath_cache yes
