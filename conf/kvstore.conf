# =============================================================================
# kvstore.conf  —  配置参考（列出当前解析器支持的所有配置项）
#
# 场景配置:
#   conf/kvstore-server.conf   专用服务器，吞吐优先
#   conf/kvstore-shared.conf   共享机器/容器，自动让出部分 CPU
#   conf/kvstore-dev.conf      开发调试，关闭 IO/复制干扰
#   conf/kvstore-local.conf    本机 6c 调试，固定 3 worker
#   conf/kvstore-master.conf   RDMA/libfabric 复制主机
#   conf/kvstore-slave.conf    RDMA/libfabric 复制从机
# =============================================================================

# =========================== Service ==========================================

# 客户端连接端口（默认: 6379）
port 2000

# 网络模型: reactor | proactor | ntyco
#   reactor   — epoll，简单稳定
#   proactor  — io_uring，高并发推荐，支持多 worker
#   ntyco     — NtyCo 协程模型
network proactor

# 最大客户端连接数（范围: 64-65536）
maxclients 10000

# 日志级别: debug | info | warn | error
loglevel info


# =========================== Persistence ======================================

# 持久化模式: none | rdb | aof
#   none — 关闭持久化
#   rdb  — RDB 快照 dump.rdb
#   aof  — AOF/WAL + RDB，启动时从 wal/incr.wal replay
persistence aof


# =========================== Workers / CPU ====================================

# 仅 proactor 模型使用多 worker。
#   threads 0    — 自动: max(1, nproc - 1)，给系统/IRQ/softirq 留 1 核
#   threads N    — 手动指定 N 个 worker，范围 1-64
#   threads -N   — 自动让出 N 个 CPU，适合共享机器/容器/开发环境
threads 0

# CPU 绑核:
#   cpu_pin auto        — 默认。worker_i 绑定到 core ((i+1) % nproc)，通常避开 core 0
#   cpu_pin off         — 不设置 pthread affinity，由内核调度
#   cpu_pin 1,2,3,4     — 手动指定 worker 依次绑定的 CPU 列表
# 专用 benchmark 可配合 test/setup_affinity.sh 把 IRQ/RPS 放到非 worker 核。
cpu_pin auto


# =========================== Replication ======================================

# RDMA/libfabric fullsync + KCP/AF_XDP incremental replication 总开关。
# master/slave 专用配置见 kvstore-master.conf 与 kvstore-slave.conf。
rdma_sync off

# 角色: master | slave
rdma_role master

# libfabric provider: tcp | verbs | sockets
#   tcp     — libfabric TCP provider，开发调试方便
#   verbs   — Soft-RoCE / InfiniBand，RDMA fullsync 推荐
#   sockets — libfabric sockets provider
rdma_provider verbs

# master: RDMA fullsync 监听地址
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# slave: RDMA fullsync 连接目标
# rdma_master_ip   192.168.30.135
# rdma_master_port 2100

# ── KCP + eBPF + AF_XDP Incremental Replication ──────────────────────────
#
# 架构:
#   - Master: eBPF socket filter 捕获写命令 → KCP 可靠传输 → AF_XDP 零拷贝发送
#   - Slave:  XDP 程序拦截 KCP 数据包 → AF_XDP 零拷贝接收 → 应用到本地
#
# 特性:
#   - KCP 协议提供可靠性（ARQ + 快速重传 + 拥塞控制）
#   - eBPF 在 socket 层旁路捕获，不影响客户端请求
#   - AF_XDP 零拷贝，延迟 50-100μs，吞吐 2M+ pps
#   - 自动降级：AF_XDP 失败时自动回退到 UDP 模式
#
# 启用增量复制（需要先启用 rdma_sync）
xdp_repl off

# 网络接口名称（lo=loopback开发, eth0=物理网卡生产）
xdp_repl_ifname lo

# 启用 AF_XDP 零拷贝（0=UDP模式, 1=AF_XDP模式）
# 注意: loopback 不支持 AF_XDP，会自动降级到 UDP
xdp_repl_zero_copy 0

# 网卡队列 ID（多队列网卡时使用，通常为 0）
xdp_repl_queue 0


# =========================== Observability ====================================
#
# 服务进程默认不加载 XDP / sockmap / uprobe 等观测组件，仅暴露必要的 INFO
# 指标与 pinned BPF map 位置。需要观测时，请使用独立工具（例如 kvs_top、
# kvs_observe）按需 attach、detach。示例配置见 conf/bench/kvstore-
# observability.conf。
#
# （无内置配置项；观测工具独立维护生命周期。）

