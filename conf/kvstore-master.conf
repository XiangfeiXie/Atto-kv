# =============================================================================
# kvstore-master.conf  —  Master 配置文件
#
# 功能:
#   - 提供 Redis 协议服务（端口 6379）
#   - RDMA 全量同步：通过 libfabric 向 slave 传输 RDB 快照
#   - 增量同步：通过 eBPF + KCP + XDP/AF_XDP 实时同步写命令
#
# 部署:
#   - 在主机虚拟机上运行
#   - 需要 root 权限（eBPF 需要）
#   - 启动命令: sudo ./build/kvstore conf/kvstore-master.conf
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（纯内存模式）

# ── 线程配置 ──────────────────────────────────────────────────────────────
threads 1                # 工作线程数（单线程模式）
cpu_pin auto             # CPU 亲和性：auto 自动绑定

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role master         # 角色：master
rdma_provider verbs        # libfabric provider: tcp（以太网）或 verbs（InfiniBand/RoCE）
rdma_listen_ip 0.0.0.0   # 监听地址：0.0.0.0 表示所有网卡
rdma_listen_port 2100    # RDMA 监听端口

# 说明:
#   - tcp provider: 适用于普通以太网，性能 ~40-50 MB/s
#   - verbs provider: 适用于 RDMA 硬件（InfiniBand/RoCE），性能 100+ MB/s
#   - 主从必须使用相同的 provider

# ── 增量同步配置（eBPF + KCP + XDP/AF_XDP）────────────────────────────────
xdp_repl on              # 启用增量同步
xdp_driver_mode skb      # XDP 模式: skb（通用）或 native（硬件加速）
xdp_repl_ifname eth33     # 网卡接口名（根据实际网卡修改：eth0/ens33/ens160 等）
xdp_repl_queue 0         # XDP 队列 ID
xdp_repl_udp_port 6383   # UDP 端口（用于 KCP 传输）
xdp_repl_tcp_port 6483   # TCP 端口（KCP 控制端口）
xdp_repl_batch 64        # 批处理大小
xdp_repl_mtu 1400        # MTU 大小

# 说明:
#   - eBPF 过滤器捕获写命令（SET/DEL/LPUSH 等），忽略读命令
#   - 性能影响：约 4-5% QPS 下降（已优化）
#   - 如果网卡支持 AF_XDP，会自动启用零拷贝模式
#   - loopback (lo) 不支持 AF_XDP，会自动降级到 UDP 模式

# ── 网卡配置说明 ──────────────────────────────────────────────────────────
# 查看可用网卡: ip link show
# 常见网卡名:
#   - eth0, eth1       (传统命名)
#   - ens33, ens160    (VMware)
#   - enp0s3, enp0s8   (VirtualBox)
#   - lo               (loopback，不支持 AF_XDP)
#
# 修改 xdp_repl_ifname 为实际网卡名


