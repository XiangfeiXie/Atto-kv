# =============================================================================
# kvstore-dev.conf  —  开发期专用（笔记本友好，IDE 不卡）
#
# 用途:
#   1. 在繁忙的开发机（IDE / Cascade / 浏览器并发占核）上做正确性 + 微基准
#   2. 4 worker 既能暴露 dict / AOF / block-wake 的并发 bug，
#      又能验证 rdlock 多 reader 并发（4-way），同时给 IDE 留出 P-core
#   3. 切换大核数环境只需把 threads 改大或改 -N，代码无需改动
#
# 行为:
#   - threads -2 → 留 2 核给 IDE / Cascade / 浏览器
#     6c 笔记本 = 4 worker，10c P+E 笔记本 = 8 worker
#   - persistence none → 排除 IO 干扰，方便测纯 dispatcher 性能
#   - io_uring DEFER_TASKRUN 闲时主动 sleep → 绑核也不会卡死 IDE
#
# 用法:
#   ./build/kvstore conf/kvstore-dev.conf
# =============================================================================

port 2000

# 高并发 io_uring 路径（rdlock/wrlock 验证目标）
network proactor

maxclients 10000
loglevel error

# Dev 期关闭持久化，避免 AOF/RDB I/O 干扰锁延迟测量
persistence none

# threads -2 = "auto-leave 2"：留 2 核给 IDE / Cascade / 浏览器
# 6c i7-13620H  → 4 worker
# 10c P+E       → 8 worker（未来 5.5.5/6 后会自动避 E-core）
# 想固定 worker 数可改 threads 4
threads -2

# auto → 绑核到 1..N。io_uring 闲时 sleep，IDE 不会被挤
# 若 IDE 在抢 1-2 号核，可改为：
#   cpu_pin 4,5,6,7         （手动指定后 4 个 P/E 核）
cpu_pin auto

# 复制 / 加速器关掉，dev 期专注 dispatcher
rdma_sync off
xdp no
