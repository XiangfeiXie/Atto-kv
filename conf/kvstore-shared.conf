# =============================================================================
# kvstore-shared.conf  —  共享服务器 / 容器（多租户友好）
#
# 适用:
#   - 一台机器跑多个服务（KV + Web + DB + ...）
#   - 容器/k8s 部署，cpu.max 受 cgroup 限制
#   - 团队共用的开发服务器，不希望 KV 把别人挤死
#
# 行为:
#   - threads -2 → 留 2 核给系统/邻居（6c 上 4 worker，16c 上 14 worker）
#   - cpu_pin auto → 仍然绑核，但 worker 数量少 → 占用率低
#   - 闲时 io_uring 进入 sleep → 绑核 ≠ 100% 占用
#   - cgroup 配额若更紧（如 docker --cpus=4），自动 cap 在 quota - 2
#
# 与"礼貌让步"的搭档命令（在 systemd unit 中加）:
#   Nice=10                       # 优先级低 10 级
#   CPUWeight=50                  # cgroup v2 权重减半
#   IOSchedulingClass=best-effort
#   IOSchedulingPriority=4
#
# 启动:
#   ./build/kvstore conf/kvstore-shared.conf
# =============================================================================

port 2000

network proactor

maxclients 20000
loglevel info

persistence aof

# threads -2 = "auto-leave 2": 总核 N → N-2 worker
# 6c 笔记本 = 4 worker
# 16c 服务器 = 14 worker
# 容器 cpu.max=4 → 2 worker（quota - reserve）
# 至少 1 worker（防 reserve 过大）
threads -2

# 绑核仍然有意义：减少 cache miss，避免在所有核之间漂
# 但 worker 数已经留出空间，不会挤死
cpu_pin auto

# 在共享环境通常不开复制 / RDMA，避免占用网络配额
rdma_sync off

# XDP 在容器里大概率没权限加载，关掉避免启动报错
xdp no
sockmap off
