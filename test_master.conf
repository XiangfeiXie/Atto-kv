# KVStore Master Configuration for TCP + XDP Replication Test

port 7379
loglevel info
maxclients 10000
persistence aof
network proactor
wal_fsync_policy everysec

# Replication - Master
rdma_sync on
rdma_role master
rdma_provider tcp
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100

# TCP + XDP Incremental Replication
xdp_repl on
xdp_repl_tcp_port 6483
xdp_repl_ifname lo
xdp_repl_queue 0
xdp_driver_mode skb
xdp_repl_batch 64
xdp_repl_mtu 1400

# Workers
threads 1
cpu_pin auto
