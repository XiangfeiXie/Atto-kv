# =============================================================================
# kvstore.conf  —  配置参考（列出所有可配置项）
#
# 用法:
#   ./kvstore conf/kvstore.conf       指定配置文件启动
#   ./kvstore                          默认加载 conf/kvstore.conf
#
# 实际部署时请按节点角色使用:
#   conf/kvstore-master.conf           主机
#   conf/kvstore-slave.conf            从机
# =============================================================================


# =========================== 服务端口 =========================================
#
# 客户端连接端口（默认: 6379）
port 2000


# =========================== 网络 I/O 模型 ====================================
#
#   reactor   — epoll（默认）
#   proactor  — io_uring（高并发推荐）
#   ntyco     — 协程
network reactor

# 最大客户端连接数（默认: 10000，范围: 64-65536）
maxclients 10000


# =========================== 日志级别 =========================================
#
#   debug | info | warn | error（默认: info）
loglevel debug


# =========================== 持久化 ===========================================
#
#   none  — 关闭
#   rdb   — RDB 快照（dump.rdb）
#   aof   — AOF + RDB 双开（appendonly.aof + dump.rdb）
#   默认: aof
persistence aof


# =========================== RDMA + eBPF 主从同步 ==============================
#
# 全量同步: fork() COW 快照 → RDMA (libfabric) 发送
# 增量同步: eBPF uprobe 捕获写命令 → TCP 传输
#
# 总开关: on | off（默认: off）
rdma_sync on

# 节点角色: master | slave（默认: master）
rdma_role master

# libfabric provider: tcp | verbs | sockets（默认: tcp）
#   tcp     — TCP 模拟（无需 RDMA 硬件，开发调试用）
#   verbs   — 内核 RDMA 栈（需 Soft-RoCE 或 InfiniBand 硬件）
rdma_provider verbs

# ---- 以下按角色二选一 ----

# 主机 RDMA 监听地址（仅 master）
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# 从机 RDMA 连接地址（仅 slave）
# rdma_master_ip   192.168.30.135
# rdma_master_port 2100


# =========================== TCP 增量同步端口 ==================================
#
# 主机在此端口监听从机的增量连接（需与从机一致）
# 默认: 6382
incr_port 6382
