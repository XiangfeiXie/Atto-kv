# =============================================================================
# kvstore.conf  —  KV Store 完整配置参考
#
# 用法：
#   ./kvstore kvstore.conf       使用本文件启动
#   ./kvstore                    默认加载 ./kvstore.conf
#
# 本文件列出了所有可配置项及详细说明，用作标准模板。
# 实际部署时请复制本文件并根据节点角色精简（参考 kvstore-master.conf
# 和 kvstore-slave.conf）。
# =============================================================================


# =========================== 网络设置 =========================================

# 服务监听端口
#   KV Store 的业务端口，客户端通过此端口连接发送命令。
#   默认: 6379
port 2000

# 网络 I/O 模型
#   reactor   — 基于 epoll 的 Reactor 模型（多路复用）
#   proactor  — 基于 io_uring 的 Proactor 模型（异步，高并发推荐）
#   ntyco     — 基于协程的 NtyCo 模型（类阻塞编程体验）
#   默认: reactor
network proactor


# =========================== 日志设置 =========================================

# 日志级别
#   debug  — 最详细（开发调试用）
#   info   — 常规信息
#   warn   — 警告
#   error  — 仅错误
#   默认: info
loglevel debug


# =========================== 存储引擎 =========================================

# KV 存储后端引擎
#   array      — 数组实现（最简单，适合小数据量）
#   rbtree     — 红黑树实现（有序，查询/插入均衡）
#   hash       — 哈希表实现（查询最快，无序）
#   skiptable  — 跳表实现（有序，范围查询友好）
#   默认: rbtree
engine skiptable


# =========================== 持久化 ===========================================

# 持久化模式
#   none  — 关闭持久化，重启数据丢失
#   rdb   — 快照模式（dump.rdb），定期全量保存
#   aof   — 追加日志模式（appendonly.aof），记录每条写命令
#   both  — AOF + RDB 同时开启，加载时优先使用 AOF
#   默认: both
persistence both


# =========================== TCP 复制（传统主从同步）===========================

# TCP 复制开关
#   on   — 启用 TCP 复制模块。主机模式下启动监听线程等待从机连接；
#          从机模式下自动连接主机的 masterip:masterport。
#   off  — 关闭复制，SLAVEOF 命令将被拒绝。
#   默认: off
replication off

# 本节点角色（仅 replication on 时有效）
#   master  — 主机
#   slave   — 从机
#   默认: master
mode master

# 主机地址（仅 mode slave 时使用）
#   从机连接主机 TCP 复制端口时的目标 IP。
masterip 127.0.0.1

# 主机复制端口（仅 mode slave 时使用）
#   从机连接主机 TCP 复制端口时的目标端口。
masterport 2001

# 复制监听端口（仅 mode master 时使用）
#   主机用于接收从机 TCP 复制连接的端口。
#   注意：这是传统 TCP 复制的端口，与 RDMA 和增量同步端口不同。
#   默认: 6380
replport 2001


# =========================== RDMA 全量同步 ====================================
#
# 基于 libfabric（Soft-RoCE/verbs）的全量同步通道。
# 完全独立于上面的 TCP 复制模块，两者可通过配置独立开关。
#
# 全量同步：主机关闭写服务 → 序列化全量数据 → RDMA 传输 → 从机重建。
# 增量同步：eBPF 捕获写命令 → TCP 传输增量数据。
# =============================================================================

# RDMA 同步开关
#   on   — 启用 RDMA 全量同步模块
#   off  — 关闭
#   默认: off
rdma_repl on

# RDMA 角色
#   master  — 主机：监听 rdma_bind_port，响应从机全量同步请求
#   slave   — 从机：主动连接主机的 rdma_master_ip:rdma_master_port
#   默认: master
rdma_role master

# libfabric 网络提供者
#   tcp     — TCP 模拟 RDMA（开发调试用，无需特殊硬件）
#   verbs   — 使用内核 RDMA 栈（需要 Soft-RoCE 或硬件 RNIC）
#   sockets — 兼容模式
#   默认: tcp
rdma_provider verbs

# 主机 RDMA 绑定地址（仅 rdma_role master 时使用）
#   主机监听 RDMA 从机连接的本机地址。
#   0.0.0.0 表示监听所有网卡。
rdma_bind_ip 127.0.0.1

# 主机 RDMA 绑定端口（仅 rdma_role master 时使用）
#   主机监听 RDMA 从机连接的端口。
#   默认: 2100
rdma_bind_port 2100

# 从机 RDMA 连接地址（仅 rdma_role slave 时使用）
#   从机连接 RDMA 主机全量同步的目标 IP。
rdma_master_ip 0.0.0.0

# 从机 RDMA 连接端口（仅 rdma_role slave 时使用）
#   从机连接 RDMA 主机全量同步的目标端口。
#   默认: 2100
rdma_master_port 2100


# =========================== 增量同步 TCP =====================================
#
# 增量同步通道。全量同步完成后，从机通过此 TCP 连接持续接收增量写命令。
# eBPF 负责捕获写数据，TCP 负责传输（替代原来的 RDMA 增量传输）。
#
# 工作流程：
#   1. 全量同步完成（RDMA）
#   2. 从机连接主机的 incr_port（TCP）
#   3. 主机回放 backlog 追赶同步期间的增量
#   4. 进入实时流式增量同步
# =============================================================================

# 增量同步 TCP 监听端口（仅 master 有效）
#   主机用于接收从机增量同步 TCP 连接的端口。
#   从机配置中的 incr_port 必须与此一致。
#   默认: 6382
incr_port 6382
