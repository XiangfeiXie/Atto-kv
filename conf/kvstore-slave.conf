# =============================================================================
# kvstore-slave.conf  —  RDMA/libfabric 复制从机配置
#
# 适用:
#   - 启动后连接 master，先 RDMA fullsync，再进入 XDP/AF_XDP 增量模式
# =============================================================================

port 2002
network proactor
maxclients 10000
loglevel info

persistence none
threads 1            
cpu_pin auto

rdma_sync on
rdma_role slave
rdma_provider tcp       # 与 master 保持一致，本地 SKB/XDP 功能测试使用 tcp provider
rdma_master_ip   127.0.0.1
rdma_master_port 2100

xdp_repl on
xdp_repl_mode skb
xdp_repl_ifname veths
xdp_repl_queue 0
xdp_repl_udp_port 6383
xdp_repl_zero_copy off
xdp_repl_batch 64
xdp_repl_mtu 1400


