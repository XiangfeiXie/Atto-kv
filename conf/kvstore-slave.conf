# =============================================================================
# kvstore-slave.conf  —  Slave 配置文件
#
# 功能:
#   - 提供 Redis 协议服务（端口 2000）
#   - 启动时通过 RDMA 从 master 拉取全量快照（全量同步）
#   - 运行时通过 TCP 接收增量写命令（增量同步）
#
# 端口规划:
#   2000 — Redis 协议服务端口（跨 VM 时与 master 端口相同无冲突）
#   6483 — TCP 增量同步端口（slave 主动连接到 master 的此端口）
#   2101 — RDMA 全量同步数据端口（slave 主动连接到 master fork 子进程的此端口）
#
# 部署:
#   - 在从机虚拟机上运行
#   - 需要 root 权限或设置 capabilities
#   - 启动命令:
#     sudo ./build/kvstore conf/kvstore-slave.conf
#   - 确保能 ping 通 master 的 IP
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口（跨 VM 可与 master 相同）
network proactor         # 使用 proactor 网络模型（io_uring）
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
# 从机通常不需要持久化（数据来自 master 全量 + 增量同步）
persistence none         # 关闭持久化（推荐）
# persistence aof        # 或启用持久化（可选，会写 AOF 文件）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 全量同步
rdma_role slave          # 角色：slave
rdma_provider verbs        # libfabric provider（必须与 master 一致）
rdma_master_ip 192.168.30.135   # ★ Master 的 IP 地址（必须修改为实际 IP）
rdma_master_port 2100    # Master RDMA 全量同步端口（用于 INFO 显示）

# Provider 选择（必须与 master 一致）:
#   tcp:
#     - 适用于任何以太网环境
#     - 开发/测试/跨VM生产环境均可使用
#     - 推荐默认选择
#
#   verbs:
#     - 需要 RDMA 硬件 或 Soft-RoCE (RXE)
#     - 跨虚拟机部署时性能更好（100+ MB/s）
#     - 需要两台 VM 都正确配置 rxe 设备
#
#   切换方法：将 rdma_provider tcp 改为 rdma_provider verbs

# ── TCP 增量同步配置 ──────────────────────────────────────────────────────

# 增量同步流程:
#   1. Slave 启动后通过 TCP 连接到 master_ip:6483
#   2. 发送同步请求（携带上次保存的 offset）
#   3. Master 根据 offset 决定：
#      - offset=0 或丢失 → 触发 RDMA 全量同步（fork 子进程在 2101 端口）
#      - offset 在 backlog 内 → 增量恢复（partial resync）
#      - offset 已过期 → 全量同步
#   4. 全量同步完成后，slave 继续通过 TCP 接收增量写命令
#   5. 连接断开后每 3 秒自动重连
#
# 性能特点:
#   - 实时同步所有写命令（SET/DEL/HSET/INCR/FLUSHALL 等）
#   - eBPF 过滤：只传输写命令，减少 60-80% 数据量
#   - TCP 可靠性：内核自动处理重传、流控
#   - 支持断线重连增量恢复（64MB backlog buffer）
#   - 自动优化：TCP_NODELAY + 2MB 缓冲区

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 修改 rdma_master_ip 为 master 虚拟机的实际 IP（必做！）
#    - 在 master 虚拟机执行: ip addr show 或 hostname -I
#    - 将上面 rdma_master_ip 的值改为查到的 IP
#
# 2. 确保 master 已启动并监听端口:
#    - 2000 (Redis 服务)
#    - 6483 (TCP 增量同步)
#    验证: telnet <master_ip> 6483
#
# 3. 确保网络连通:
#    ping <master_ip>
#
# 4. 设置 capabilities（推荐）或使用 sudo:
#    sudo setcap cap_bpf,cap_perfmon,cap_net_admin,cap_sys_admin+ep build/kvstore
#    然后直接运行: ./build/kvstore conf/kvstore-slave.conf
#
# 5. 预期日志（启动顺序必须 master 先，slave 后）:
#    [REPL-TCP] Connected to <master_ip>:6483
#    [REPL-TCP] Master requires full sync (base_seq=N, rdma_port=2101)
#    [SLAVE] Starting fullsync to <master_ip>:2101
#    [SLAVE] Connected to master child process
#    [SLAVE] Total: N batches, N entries
#    [REPL-TCP] RDMA fullsync completed
#    [REPL-TCP] Connected and synced with master
#
# 6. 验证同步:
#    redis-cli -h <master_ip> -p 2000 SET test_key "hello"
#    redis-cli -h <slave_ip>  -p 2000 GET test_key
#    → "hello"
