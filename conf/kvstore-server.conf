# =============================================================================
# kvstore-server.conf  —  专用服务器配置（吞吐优先）
#
# 适用:
#   - 物理机或 dedicated VM，主要运行 KVStore
#   - 追求常规业务吞吐，BPF/XDP 观测按需手动开启
#
# 启动:
#   ./build/kvstore conf/kvstore-server.conf
# =============================================================================

port 2000
network proactor
maxclients 65536
loglevel info

# AOF/WAL + RDB。AOF 由后台 WAL consumer 批量 writev，RDB 走 fork-COW snapshot。
persistence aof

# 自动使用 nproc-1 worker；cgroup cpu.max 更小时按 quota 收敛。
threads 0
cpu_pin auto

# 普通单机服务默认不开复制；需要复制时使用 kvstore-master.conf / kvstore-slave.conf。
rdma_sync off
rdma_role master
rdma_provider tcp
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100
incr_port 6382

fastpath_cache yes

