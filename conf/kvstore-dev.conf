# =============================================================================
# kvstore-dev.conf  —  开发期专用（4 worker，干净环境）
#
# 用途:
#   1. 在繁忙的开发机（IDE / Cascade / 浏览器并发占核）上做正确性 + 微基准
#   2. 4 worker 既能暴露 dict / AOF / block-wake 的并发 bug，
#      又能验证 rdlock 多 reader 并发（4-way），同时给 IDE 留出 P-core
#   3. 切换大核数环境只需把 threads 改大，代码无需改动
#
# 用法:
#   ./build/kvstore conf/kvstore-dev.conf
# =============================================================================

port 2000

# 高并发 io_uring 路径（rdlock/wrlock 验证目标）
network proactor

maxclients 10000
loglevel error

# Dev 期关闭持久化，避免 AOF/RDB I/O 干扰锁延迟测量
persistence none

# 4 worker：dispatcher 多线程关键路径，匹配 4-core 开发预算
threads 4

# auto → 绑核到 0..threads-1。若 IDE 在抢 0-1 号核，可改为：
#   cpu_pin 6,7,8,9         （手动指定后 4 个 P/E 核）
cpu_pin auto

# 复制 / 加速器关掉，dev 期专注 dispatcher
rdma_sync off
xdp no
