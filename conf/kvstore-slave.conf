# =============================================================================
# kvstore-slave.conf  —  RDMA/libfabric 复制从机配置
#
# 适用:
#   - 启动后连接 master，先 RDMA fullsync，再 TCP incremental catchup
#   - 从机通常不对外承接高频 GET，默认关闭 fastpath cache 降低回放维护成本
#
# 启动:
#   ./build/kvstore conf/kvstore-slave.conf
# =============================================================================

port 2002
network proactor
maxclients 10000
loglevel info

persistence none
threads 0
cpu_pin auto

rdma_sync on
rdma_role slave
rdma_provider verbs
rdma_master_ip   192.168.30.135
rdma_master_port 2100
incr_port 6382

# 也可删除本行，程序会在 rdma_role=slave 且未显式配置时自动关闭 fastpath_cache。
fastpath_cache no

