# =============================================================================
# kvstore.conf — 配置参考（Config Reference）
#
# 本文件是 kvstore 全部配置项的完整说明，展示每项的含义、取值与默认值。
# 不直接用于启动；用于两机主从测试请使用 kvstore-master.conf / kvstore-slave.conf。
# 配置格式:  `<key> <value>`，空行与 `#` 开头的行忽略。
# 布尔取值:  on | off
#
# 全局结构一览:
#   1.  服务 Service
#   2.  持久化 Persistence
#   3.  全量同步 Full Sync（2 种: rdma / sendfile）
#   4.  增量同步 Incr Sync（2 种: incr_sync / xdptracepoint 守护进程）
#   5.  其他 Other（expire / latency_histogram）
# =============================================================================

# ── 1. 服务 Service ─────────────────────────────────────────────────────────

# port <1-65535>                    默认 6379
#   客户端连接监听端口；Master 上同时是 Slave 发送 FULLSYNC 握手的端口。
# port 6379

# network <reactor|proactor>        默认 reactor
#   网络引擎。reactor = epoll 事件驱动；proactor = io_uring(SQPOLL+provided buffer)。
#   注意: 仅 reactor / proactor 两种；ntyco 为保留引擎，当前不使用。
# network reactor

# maxclients <int>                  默认 10000
#   最大客户端连接数。
# maxclients 10000

# loglevel <debug|info|warn|error>  默认 info
#   日志级别。
# loglevel info

# ── 2. 持久化 Persistence ───────────────────────────────────────────────────

# persistence <none|rdb|aof>        默认 none
#   none = 不持久化；rdb = RDB 快照；aof = AOF 追加日志。
# persistence none

# aof_fsync_policy <always|everysec> 默认 everysec
#   AOF 刷盘策略（persistence=aof 时生效）。everysec 每秒 fsync；always 每条 fsync。
# aof_fsync_policy everysec

# ── 3. 全量同步 Full Sync ───────────────────────────────────────────────────

# rdma_sync <on|off>                默认 off
#   全量同步主开关。on = 启用（Master 侧监听 / Slave 侧发起连接）。
# rdma_sync off

# rdma_role <master|slave>          默认 master
#   角色。master = 提供 RDB；slave = 拉取并加载 RDB。
# rdma_role master

# fullsync_transport <rdma|sendfile|tcp>  默认 rdma
#   全量同步传输方式（两种，二选一，Master/Slave 须一致）:
#     rdma     — RDMA verbs (RoCE / SoftRoCE) 传输，需要 RDMA 网卡。
#     sendfile — TCP sendfile() 零拷贝传输，无需 RDMA（别名 "tcp"）。
# fullsync_transport rdma

# rdma_listen_ip <ip>               默认 0.0.0.0
#   【仅 Master】RDMA CM 监听地址，应设为 Master 的 RDMA 网卡 IP。
# rdma_listen_ip 0.0.0.0

# rdma_listen_port <1-65535>        默认 2101
#   【仅 Master】全量同步数据基准端口。
#   端口约定: RDMA 数据走该端口；TCP sendfile 数据走该端口 + 1。
# rdma_listen_port 2101

# rdma_master_ip <ip>               默认 127.0.0.1
#   【仅 Slave】Master 的 RDMA 网卡 IP。
# rdma_master_ip 127.0.0.1

# rdma_master_port <1-65535>        默认 2101
#   【仅 Slave】须等于 Master 的 rdma_listen_port。
# rdma_master_port 2101

# master_port <1-65535>             默认 6379
#   【仅 Slave】Master 主服务端口（Slave 向此端口发 FULLSYNC 握手命令）。
# master_port 6379

# fullsync_timeout <ms>             默认 3600000 (1 小时)
#   全量同步超时时间。
# fullsync_timeout 3600000

# fullsync_max_retries <int>        默认 3
#   全量同步失败最大重试次数。
# fullsync_max_retries 3

# ── 4. 增量同步 Incr Sync（2 种，可独立开关）────────────────────────────────

# 【方式 ①】嵌入式 epoll PSYNC —— 进程内增量同步
#
# incr_sync <on|off>                默认 off
#   嵌入式增量同步开关。Master 把写命令 memcpy 进 1MB 环形 backlog，
#   Slave 通过 PSYNC 握手按 offset 拉取追平。与全量同步相互独立。
# incr_sync off
#
# incr_repl_port <1-65535>          默认 2001
#   增量同步端口。Master 监听此端口；Slave 连接 Master 的此端口。
# incr_repl_port 2001

# 【方式 ②】eBPF tracepoint 旁路 —— 独立守护进程
#
# 独立守护进程 kvstore-incr-sync（src/repl-incr-xdptracepoint/），
# 编译期配置（其 config.h）: SLAVE_IP / SLAVE_PORT / KVS_FILTER_PORT / XDP_IFACE。
# 不在本文件配置。运行于 Master 机器，捕获 dport==KVS_FILTER_PORT 的入向流量
# 原样回放到 Slave。

# ── 5. 其他 Other ───────────────────────────────────────────────────────────

# expire <on|off>                   默认 off
#   主动过期开关（惰性过期始终生效）。on = 事件循环中周期性随机采样删除过期键。
# expire off

# latency_histogram <on|off>        默认 off
#   请求延迟直方图。on = 开启，INFO stats 输出 p50/p99/p999。
# latency_histogram off
