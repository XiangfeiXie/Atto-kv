# =============================================================================
# kvstore-master.conf  —  Master 配置文件
#
# 功能:
#   - 提供 Redis 协议服务（端口 2000）
#   - RDMA 全量同步：通过 libfabric 向 slave 传输 RDB 快照
#   - TCP + eBPF 增量同步：实时同步写命令
#
# 部署:
#   - 在主机虚拟机上运行
#   - 需要 root 权限或设置 capabilities（eBPF 需要）
#   - 启动命令:
#     export BUILD_DIR=/path/to/kvstore/build
#     sudo BUILD_DIR=$BUILD_DIR ./build/kvstore conf/kvstore-master.conf
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
# 推荐主机启用持久化，从机可以关闭
persistence aof          # 启用 AOF 持久化（推荐）
# persistence none       # 或关闭持久化（测试用）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role master         # 角色：master
rdma_provider tcp        # libfabric provider: tcp（以太网）或 verbs（RDMA 硬件）
rdma_listen_ip 0.0.0.0   # 监听地址：0.0.0.0 表示所有网卡
rdma_listen_port 2100    # RDMA 监听端口

# Provider 说明:
#   tcp provider:
#     - 适用于普通以太网环境
#     - 性能：40-50 MB/s
#     - 兼容性好，推荐用于开发、测试和生产（无 RDMA 硬件）
#
#   verbs provider:
#     - 适用于 RDMA 硬件（InfiniBand/RoCE）
#     - 性能：100+ MB/s
#     - 需要硬件支持或配置 Soft-RoCE
#     - 如果初始化失败，改用 tcp provider
#
#   注意：主从必须使用相同的 provider

# ── TCP + eBPF 增量同步配置 ───────────────────────────────────────────────
incr_repl on              # 启用增量同步
incr_repl_port 6483       # TCP 复制端口

# 增量同步架构:
#   1. eBPF 过滤器捕获写命令（SET/DEL/HSET 等）
#   2. 写入 64MB 复制积压缓冲区
#   3. 通过 TCP 发送到 slave
#   4. Slave 接收后应用到本地 kvstore
#
# 性能特点:
#   - eBPF 过滤：减少 60-80% 数据量
#   - TCP 可靠性：内核自动处理重传、流控
#   - 延迟：1-3ms（本地网络）
#   - 吞吐量：300-500 MB/s
#   - 自动优化：TCP_NODELAY + 2MB 缓冲区

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 设置 BUILD_DIR 环境变量:
#    export BUILD_DIR=/home/xxf/9.1-kvstore/build
#
# 2. 设置 capabilities（或使用 sudo）:
#    sudo setcap cap_bpf,cap_perfmon,cap_net_admin,cap_sys_admin+ep kvstore
#
# 3. 开放防火墙端口:
#    sudo ufw allow 2000/tcp  # Redis 服务
#    sudo ufw allow 2100/tcp  # RDMA 全量同步
#    sudo ufw allow 6483/tcp  # TCP 增量同步
#
# 4. 验证端口监听:
#    netstat -tuln | grep -E ":(2000|2100|6483)"
#
# 5. 检查日志:
#    [RDMA-REPL] master: listening for slaves
#    [REPL-TCP] eBPF filter loaded, monitoring port 2000
#    [REPL-TCP] Master initialized on port 6483
