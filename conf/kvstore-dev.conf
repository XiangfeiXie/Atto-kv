# =============================================================================
# kvstore-dev.conf  —  开发期配置（笔记本/IDE 友好）
#
# 目标:
#   - 关闭持久化、复制和 BPF 观测，避免 IO/网络/内核观测干扰调试
#   - threads -2 自动让出 2 个 CPU 给 IDE、浏览器、编译器等前台任务
#   - 仍保持 proactor 多 worker，方便暴露并发 bug
#
# 启动:
#   ./build/kvstore conf/kvstore-dev.conf
# =============================================================================

port 2000
network proactor
maxclients 10000
loglevel error

persistence none

# 6c 机器约 4 worker；容器中会受 cpu.max 限制。
threads -2
cpu_pin auto

rdma_sync off
rdma_role master
rdma_provider tcp
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100

xdp_repl off
xdp_repl_ifname lo
xdp_repl_port 6483
xdp_repl_zero_copy 0


