# =============================================================================
# kvstore-master.conf  —  Master 配置
#
# 用法: ./build/kvstore conf/kvstore-master.conf
#
# 全量同步架构:
#   1. Slave TCP "FULLSYNC" → Master fork 子进程
#   2. Master 子进程 → RDMA_WRITE 流式推送 或 TCP sendfile 零拷贝
#   3. Slave 子进程 → 接收 → 解析加载
#
# 端口: 2100 — Redis 协议 + FULLSYNC TCP + RDMA（协议不同，不冲突）
# =============================================================================

# ── 服务 ────────────────────────────────────────────────────────────────
port 2000
network proactor
maxclients 10000
loglevel info

# ── 持久化 ──────────────────────────────────────────────────────────────
persistence none

# ── 全量同步 ────────────────────────────────────────────────────────────
rdma_sync on
rdma_role master
rdma_listen_ip 192.168.30.135    # ★ rxe 设备对应 IP
rdma_listen_port 2100             # TCP FULLSYNC + RDMA 共用端口

# 传输方式: rdma (RDMA verbs, 默认) | tcp (sendfile 零拷贝)
# fullsync_transport rdma
