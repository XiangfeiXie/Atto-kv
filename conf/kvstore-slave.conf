# =============================================================================
# kvstore-slave.conf  —  RDMA/libfabric 复制从机配置
#
# 适用:
#   - 启动后连接 master，先 RDMA fullsync，再 TCP incremental catchup
#
# 启动:
#   ./build/kvstore conf/kvstore-slave.conf
# =============================================================================

port 2002
network proactor
maxclients 10000
loglevel info

persistence none
threads 1            
cpu_pin auto

rdma_sync on
rdma_role slave
rdma_provider verbs     # 与 master 保持一致，默认 Soft-RoCE / TCP provider
rdma_master_ip   192.168.30.135   # 请替换为 master 主机地址
rdma_master_port 2100
incr_port 6382


