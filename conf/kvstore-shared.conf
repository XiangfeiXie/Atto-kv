# =============================================================================
# kvstore-shared.conf  —  共享服务器 / 容器配置（多租户友好）
#
# 适用:
#   - 一台机器跑多个服务
#   - 容器/k8s 部署，cpu.max 受 cgroup 限制
#   - 团队共用开发服务器，不希望 KVStore 抢满 CPU
#
# 启动:
#   ./build/kvstore conf/kvstore-shared.conf
# =============================================================================

port 2000
network proactor
maxclients 20000
loglevel info

persistence aof

# 自动让出 2 个 CPU；例如 6c -> 4 worker，cpu.max=4 -> 2 worker。
threads -2
cpu_pin auto

rdma_sync off
rdma_role master
rdma_provider tcp
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100
incr_port 6382

fastpath_cache yes

