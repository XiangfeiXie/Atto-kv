# =============================================================================
# kvstore-master.conf — 主从复制 · 主机（Master）配置
#
# 用于两台机器间主从同步测试，搭配 kvstore-slave.conf 使用。
# 启动:  ./build/kvstore conf/kvstore-master.conf
#
# 全量同步（2 种，二选一，由 fullsync_transport 决定）：
#   · RDMA          — fullsync_transport rdma       （默认，需 RDMA 网卡 / SoftRoCE）
#   · TCP sendfile  — fullsync_transport sendfile   （零拷贝，无需 RDMA）
#
# 增量同步（3 种，可独立开关）：
#   ① 嵌入式 epoll PSYNC   — incr_sync on     （本进程内，1MB backlog + PSYNC）
#   ② AF_XDP + KCP 旁路    — xdp_sync on      （需另起网关进程 + veth）
#   ③ eBPF tracepoint 旁路 — 独立守护进程      （编译期配置，不在本文件）
# =============================================================================

# ── 服务 Service ────────────────────────────────────────────────────────────
port 2000              # 客户端连接端口（也是 Slave 发送 FULLSYNC 握手的端口）
network proactor       # 网络引擎: reactor | proactor
maxclients 10000
loglevel info

# ── 持久化 Persistence ──────────────────────────────────────────────────────
persistence rdb        # 主机需能 SAVE 出 RDB 供全量同步传输
wal_fsync_policy everysec

# ── 全量同步（Master 侧）────────────────────────────────────────────────────
rdma_sync on           # 全量同步主开关
rdma_role master       # 角色: master

rdma_listen_ip   192.168.30.137   # RDMA CM 监听地址（改成主机实际 RDMA 网卡 IP）
rdma_listen_port 2100             # 全量同步数据基准端口（Slave 的 rdma_master_port 须与此一致）
                                  #   RDMA 数据走 2100；TCP sendfile 数据走 2101（= port + 1）

# 传输方式（与 Slave 的 fullsync_transport 必须一致）:
fullsync_transport sendfile           # rdma | sendfile
# fullsync_transport sendfile     # 取消注释切换为 TCP sendfile 零拷贝（无需 RDMA）

fullsync_timeout     3600000      # 全量同步超时 (ms)
fullsync_max_retries 3            # 最大重试次数

# ── 增量同步 ①：嵌入式 epoll PSYNC ─────────────────────────────────────────
incr_sync off          # 本进程内增量同步（写命令 memcpy 入 1MB backlog，Slave PSYNC 拉取）
incr_repl_port 2001   # 增量同步监听端口（Slave 连接 Master 的此端口）

# ── 增量同步 ②：AF_XDP + KCP 旁路 ─────────────────────────────────────────
# 写命令经 /dev/shm 无锁 SPSC 交给独立网关进程（kvstore-xdp-gateway --master），
# 走 AF_XDP 内核旁路 + KCP 可靠 UDP。需另起网关并配置 veth 对，
# 详见 src/repl-incr-xdpkcp/README.md。
xdp_sync on         # 取消注释启用

# ── 增量同步 ③：eBPF tracepoint 旁路 ───────────────────────────────────────
# 独立守护进程 kvstore-incr-sync（src/repl-incr-xdptracepoint/），编译期配置见其
# config.h（SLAVE_IP / SLAVE_PORT / KVS_FILTER_PORT / XDP_IFACE），不在本文件配置。
# 在 Master 机器上运行，捕获 dport==KVS_FILTER_PORT 的入向流量原样回放到 Slave。

# ── 其他 Other ──────────────────────────────────────────────────────────────
expire off            # 关闭主动过期，避免干扰同步测试
# latency_histogram on   # 开启请求延迟直方图（INFO stats 输出 p50/p99/p999）
