# =============================================================================
# kvstore-slave.conf  —  Slave 配置文件
#
# 功能:
#   - 提供 Redis 协议只读服务（端口 2000）
#   - 启动时通过 RDMA 从 master 拉取全量快照
#   - 运行时通过 TCP 接收增量写命令
#
# 部署:
#   - 在从机虚拟机上运行
#   - 需要 root 权限或设置 capabilities
#   - 启动命令:
#     export BUILD_DIR=/path/to/kvstore/build
#     sudo BUILD_DIR=$BUILD_DIR ./build/kvstore conf/kvstore-slave.conf
#   - 确保能连接到 master 的 IP 和端口
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口（可与 master 不同，如 2001）
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
# 从机通常不需要持久化（数据来自 master）
persistence none         # 关闭持久化（推荐）
# persistence aof        # 或启用持久化（可选）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role slave          # 角色：slave
rdma_provider tcp        # libfabric provider（必须与 master 一致）
rdma_master_ip 192.168.30.135   # Master IP 地址（修改为实际 master IP）
rdma_master_port 2100    # Master RDMA 端口

# 重要说明:
#   - rdma_master_ip 必须修改为实际 master 虚拟机的 IP 地址
#   - rdma_provider 必须与 master 保持一致（tcp 或 verbs）
#   - 启动时会自动连接 master 并拉取全量数据
#
# Provider 说明:
#   tcp provider:
#     - 适用于普通以太网环境
#     - 兼容性好，推荐使用
#
#   verbs provider:
#     - 适用于 RDMA 硬件（InfiniBand/RoCE）
#     - 需要硬件支持或配置 Soft-RoCE
#     - 如果初始化失败，改用 tcp provider

# ── TCP 增量同步配置 ──────────────────────────────────────────────────────
incr_repl on              # 启用增量同步
incr_repl_master_port 6483  # Master 的 TCP 复制端口（slave 连接到此端口）

# 增量同步流程:
#   1. Slave 主动连接到 master_ip:incr_repl_master_port
#   2. 接收 master 发送的写命令
#   3. 应用到本地 kvstore
#   4. 连接断开后每 3 秒自动重连
#
# 性能特点:
#   - eBPF 过滤：只接收写命令（SET/DEL/HSET 等）
#   - TCP 可靠性：内核自动处理重传、流控
#   - 延迟：1-3ms（本地网络）
#   - 吞吐量：300-500 MB/s
#   - 自动优化：TCP_NODELAY + 2MB 缓冲区
#   - 支持断线重连增量恢复

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 修改 rdma_master_ip 为 master 虚拟机的实际 IP
#
# 2. 确保 master 已启动并监听端口:
#    - 2100 (RDMA 全量同步)
#    - 6483 (TCP 增量同步)
#
# 3. 确保网络连通:
#    ping <master_ip>
#    telnet <master_ip> 2100
#    telnet <master_ip> 6483
#
# 4. 设置 BUILD_DIR 环境变量:
#    export BUILD_DIR=/home/xxf/9.1-kvstore/build
#
# 5. 设置 capabilities（或使用 sudo）:
#    sudo setcap cap_bpf,cap_perfmon,cap_net_admin,cap_sys_admin+ep kvstore
#
# 6. 检查日志:
#    [RDMA-REPL] slave: connected, awaiting streaming full sync
#    [RDMA-REPL] slave: loaded N keys from fullsync
#    [REPL-TCP] Connected to <master_ip>:6483
