# =============================================================================
# kvstore-slave.conf  —  Slave 配置
#
# 用法: ./build/kvstore conf/kvstore-slave.conf
#
# 全量同步架构:
#   1. Slave TCP "FULLSYNC" → Master fork 子进程
#   2. Master 子进程 → RDMA_WRITE 流式推送 或 TCP sendfile 零拷贝
#   3. Slave 子进程 → 接收 → 解析加载
#
# ★ 先启动 Master，再启动 Slave
# =============================================================================

# ── 服务 ────────────────────────────────────────────────────────────────
port 2001                         # 本地测试与 master 2000 区分；跨机可与 master 相同
network proactor
maxclients 10000
loglevel info

# ── 持久化 ──────────────────────────────────────────────────────────────
persistence none

# ── 全量同步 ────────────────────────────────────────────────────────────
rdma_sync on
rdma_role slave
rdma_master_ip 192.168.30.135    # ★ Master IP
rdma_master_port 2100             # Master TCP FULLSYNC + RDMA 端口

# 传输方式: 必须与 master 一致
# fullsync_transport rdma
