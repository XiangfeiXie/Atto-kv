# =============================================================================
# kvstore-master.conf  —  RDMA/libfabric 复制主机配置
#
# 适用:
#   - master 提供客户端写入
#   - slave 通过 RDMA fullsync 拉取快照，再通过 TCP incremental catchup 追增量
#
# 启动:
#   ./build/kvstore conf/kvstore-master.conf
# =============================================================================

port 2000
network proactor
maxclients 10000
loglevel info

persistence aof
threads 1            
cpu_pin auto

rdma_sync on
rdma_role master
rdma_provider verbs     # Soft-RoCE/普通环境默认使用 tcp provider 更兼容
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100
incr_port 6382

fastpath_cache yes

