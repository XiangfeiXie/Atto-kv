# =============================================================================
# kvstore-slave.conf  —  从机启动配置（RDMA 全量 + TCP 增量同步）
#
# 启动:  ./kvstore kvstore-slave.conf
# =============================================================================

# ---- 服务端口 ----
port 2002

# ---- 网络模型 ----
network proactor

# ---- 日志级别 ----
loglevel info

# ---- 存储引擎 ----
engine skiptable

# ---- 持久化 ----
persistence none

# ---- TCP 复制（本项目中关闭，使用 RDMA + TCP 增量替代）----
replication off
mode slave
masterip 127.0.0.1
masterport 2001
replport 2003

# ---- RDMA 全量同步 ----
rdma_repl on
rdma_role slave
rdma_provider verbs
rdma_bind_ip      127.0.0.1
rdma_bind_port    2101
rdma_master_ip    192.168.30.135   # 主机 IP，用于 RDMA 全量同步连接
rdma_master_port  2100             # 主机 RDMA 全量同步端口

# ---- TCP 增量同步（eBPF 捕获 + TCP 传输）----
incr_port 6382                     # 必须与主机的 incr_port 一致
