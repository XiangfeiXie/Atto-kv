# =============================================================================
# kvstore.conf  —  KV Store 配置参考
#
# 用法：
#   ./kvstore kvstore.conf       使用本文件启动
#   ./kvstore                    默认加载 ./kvstore.conf
#
# 本文件列出所有可配置项及说明，用作配置模板。
# 实际部署时请按节点角色精简（参考 kvstore-master.conf / kvstore-slave.conf）。
# =============================================================================


# =========================== 网络设置 =========================================

# 服务监听端口（默认: 6379）
port 2000

# 网络 I/O 模型
#   reactor   — 基于 epoll 的 Reactor 模型
#   proactor  — 基于 io_uring 的 Proactor 模型（高并发推荐）
#   ntyco     — 基于协程的 NtyCo 模型
#   默认: reactor
network proactor


# =========================== 日志设置 =========================================

# 日志级别: debug / info / warn / error（默认: info）
loglevel debug


# =========================== 存储引擎 =========================================

# KV 存储后端
#   array      — 数组（简单，小数据量）
#   rbtree     — 红黑树（有序，读写均衡）
#   hash       — 哈希表（查询最快，无序）
#   skiptable  — 跳表（有序，范围查询友好）
#   默认: rbtree
engine skiptable


# =========================== 持久化 ===========================================

# 持久化模式
#   none  — 关闭持久化
#   rdb   — 快照模式（dump.rdb），io_uring 异步落盘
#   aof   — 追加日志模式（appendonly.aof），io_uring 批量写入
#   both  — RDB + AOF 同时开启，加载时优先 AOF
#   默认: both
persistence both


# =========================== RDMA + eBPF 主从同步 ===============================
#
# 全量同步：主机通过 RDMA (libfabric) 将全量数据发送给从机。
# 增量同步：eBPF 捕获写命令，通过 TCP 持续传输增量。
#
# 总开关:
#   on   — 启用 RDMA 全量 + eBPF/TCP 增量同步
#   off  — 关闭主从同步
rdma_sync on

# RDMA 同步子开关（兼容保留）
rdma_repl on

# RDMA 角色: master / slave（默认: master）
rdma_role master

# libfabric 网络提供者
#   tcp     — TCP 模拟（开发调试，无需特殊硬件）
#   verbs   — 内核 RDMA 栈（需 Soft-RoCE 或硬件 RNIC）
#   sockets — 兼容模式
#   默认: tcp
rdma_provider verbs

# 主机 RDMA 绑定地址（仅 master）
rdma_bind_ip 127.0.0.1

# 主机 RDMA 绑定端口（仅 master，默认: 2100）
rdma_bind_port 2100

# 从机 RDMA 连接地址（仅 slave）
rdma_master_ip 0.0.0.0

# 从机 RDMA 连接端口（仅 slave，默认: 2100）
rdma_master_port 2100


# =========================== 增量同步 TCP =====================================
#
# 全量同步完成后，从机通过此 TCP 连接接收增量写命令。
# eBPF 捕获写数据，TCP 传输。
#
# 增量同步 TCP 监听端口（仅 master，默认: 6382）
incr_port 6382
