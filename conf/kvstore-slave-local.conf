# =============================================================================
# kvstore-slave-local.conf  —  Slave 本地测试配置
#
# 用法: sudo ./build/kvstore conf/kvstore-slave-local.conf
# 注意: 必须先启动 master，再启动 slave
#
# 端口:
#   2001 — Redis 协议服务（与 master 的 2000 区分，避免端口冲突）
#   2101 — RDMA 全量同步数据（连接到 master fork 子进程的此端口）
#   6483 — TCP 增量同步（连接到 master 的此端口）
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2001                # Redis 协议服务端口（本地测试用 2001，避免与 master 2000 冲突）
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（本地测试用纯内存模式）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 全量同步
rdma_role slave          # 角色：slave
rdma_provider tcp        # ★ 本地测试必须使用 tcp（单机 verbs 有 RXE loopback 问题）
rdma_master_ip 127.0.0.1 # Master IP 地址（本地测试用 127.0.0.1，配合 tcp provider）
rdma_master_port 2100    # Master RDMA 全量同步端口（显示用，实际连接 2101）

# ── TCP 增量同步配置 ──────────────────────────────────────────────────────
incr_repl on             # 启用增量同步（需要 sudo/capabilities 加载 eBPF）
incr_repl_master_port 6483  # Master 的 TCP 复制端口
