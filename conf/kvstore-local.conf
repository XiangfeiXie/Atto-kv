# =============================================================================
# kvstore-local.conf  —  本机 6c 调试配置（固定 3 worker）
#
# 目标:
#   - 3 worker 手动绑定到 cores 3,4,5，前 3 核留给 IDE/softirq
#   - 默认开启 AOF/WAL，方便同时验证持久化路径
#   - 关闭 RDMA/BPF 观测，保持本机调试简单可复现
#
# 启动:
#   ./build/kvstore conf/kvstore-local.conf
# =============================================================================

port 2000
network proactor
maxclients 10000
loglevel info

persistence aof

threads 3
cpu_pin 3,4,5

rdma_sync off
rdma_role master
rdma_provider tcp
rdma_listen_ip 0.0.0.0
rdma_listen_port 2100
incr_port 6382

# 1024 buckets × 512B = 512 KB；热点小字符串 GET 可跳过 shard 锁和 dict lookup。
fastpath_cache yes

