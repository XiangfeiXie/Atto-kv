# ============================================================
# kvstore.conf  —  KV Store runtime configuration
# Usage:  ./kvstore kvstore.conf
#         ./kvstore            (defaults to ./kvstore.conf)
# ============================================================

# ---- Network -----------------------------------------------
# Listening port
port 2000

# Network I/O model: reactor | proactor | ntyco
network proactor

# ---- Logging -----------------------------------------------
# Log level: debug | info | warn | error
loglevel debug

# ---- Replication -------------------------------------------
# Enable master-slave replication: on | off
#   on  — start replication module (master accepts slaves;
#         slave connects to masterip:masterport automatically)
#   off — replication fully disabled; SLAVEOF command is rejected
replication off

# Role: master | slave  (only used when replication is on)
mode master

# When mode is slave, uncomment and set the master address:
masterip   127.0.0.1
masterport 2001

# ---- Persistence -------------------------------------------
# Persistence model: none | rdb | aof | both
#   none  — no persistence, data is lost on restart
#   rdb   — periodic snapshot only (dump.rdb)
#   aof   — append-only log only  (appendonly.aof)
#   both  — aof preferred for load; rdb kept as backup
persistence both 

# Replication listen port (master binds; slave connects to this port on master)
replport 2001

# ---- RDMA full-sync (libfabric / Soft-RoCE) ---------------
# Experimental full-synchronization channel, completely isolated from
# the legacy replication above. At this stage only full sync is
# implemented; incremental propagation is NOT handled here.
#
# Enable the RDMA sync module: on | off
rdma_repl on

# Role on this side: master | slave
rdma_role master

# libfabric provider name (tcp | verbs | sockets | udp ...).
# Use 'verbs' together with the kernel rxe module for Soft-RoCE.
rdma_provider verbs

# Master: local bind address and port for the libfabric listener
rdma_bind_ip   127.0.0.1
rdma_bind_port 2100

# Slave: address of the RDMA master to pull the full dump from
rdma_master_ip   0.0.0.0
rdma_master_port 2100

# Storage engine: array | rbtree | hash | skiptable
engine skiptable
