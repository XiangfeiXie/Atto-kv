# =============================================================================
# kvstore-xdp-master.conf — XDP 镜像增量同步 · Master
#
# 配合 repl-xdp 组件使用：XDP 挂本机客户端流量所经网卡（veth0）入方向，
# 把客户端 → 本端口(2000) 的写命令采样并镜像到 Slave 端口(2001)。
#
# 说明：
#   · repl_role off —— 增量同步完全由 XDP 镜像完成，不启用 PSYNC 双写。
#   · 须运行在 Master netns（red）内，veth0 IP 10.0.1.1/24。
#   · 客户端连 10.0.1.1:2000 写入，Slave 端 10.0.1.2:2001 收镜像。
# =============================================================================

port 2000
network proactor
maxclients 10000
persistence off
repl_role off
expire off
