# =============================================================================
# kvstore-slave.conf — 主从复制 · 从机（Slave）配置
#
# 用于两台机器间主从同步测试，搭配 kvstore-master.conf 使用。
# 启动:  ./build/kvstore conf/kvstore-slave.conf
#
# repl_role slave 的启动序列（由引擎主循环的 repl tick 推进）：
#   1. 连 Master 主端口发 PSYNC <offset>（首次 offset=0）；
#   2. +CONTINUE → 流式追平 backlog；+FULLRESYNC → 走数据面端口
#      全量（fullsync_transport = sendfile | rdma，须与 Master 一致），
#      加载后以快照 offset 重新 PSYNC 续连；
#   3. 断线由 tick 按 offset 自动重连续传。
# =============================================================================

# ── 服务 Service ────────────────────────────────────────────────────────────
port 2000              # Slave 本地监听端口（可异于 Master，互不影响）
network proactor       # 网络引擎: reactor | proactor
maxclients 10000

# ── 持久化 Persistence ──────────────────────────────────────────────────────
# Slave 数据来自 Master，一般无需本地持久化；如需落盘再打开 rdb/aof。
persistence none       # none | rdb | aof
aof_fsync_policy everysec

# ── 复制 Replication ────────────────────────────────────────────────────────
repl_role slave        # off | master | slave（总开关）

incr_sync off           # 增量同步开关: on → 全量后 PSYNC 流式; off → 仅一次全量
fullsync_transport rdma   # 全量传输方式: sendfile | rdma（与 Master 必须一致）

master_port        2000             # Master 主服务端口（PSYNC 握手，+FULLRESYNC 驱动全量）
fullsync_master_ip 192.168.30.137   # Master 的地址（改成实际 IP）
fullsync_port      2100             # 须等于 Master 的 fullsync_port（数据端口, 两种传输共用）

# 传输方式切换（无需 RDMA 网卡则用 sendfile 即可）:
# fullsync_transport rdma

# ── 其他 Other ──────────────────────────────────────────────────────────────
expire off            # 关闭主动过期，避免干扰同步测试
# latency_histogram on   # 开启请求延迟直方图（INFO stats 输出 p50/p99/p999）
