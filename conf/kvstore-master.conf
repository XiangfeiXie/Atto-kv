# =============================================================================
# kvstore-master.conf  —  Master 配置文件
#
# 功能:
#   - 提供 Redis 协议服务（端口 2000）
#   - RDMA 全量同步：slave 启动时，fork 子进程通过 libfabric 流式传输全量数据
#   - TCP + eBPF 增量同步：实时捕获并同步写命令到 slave
#
# 端口规划:
#   2000 — Redis 协议服务端口
#   2101 — RDMA 全量同步数据端口（fork 子进程监听，配置文件中无需指定）
#   6483 — TCP 增量同步端口（控制通道 + 增量数据 + 心跳）
#
# 部署:
#   - 在主机虚拟机上运行
#   - 需要 root 权限或设置 capabilities（eBPF 需要）
#   - 启动命令:
#     sudo ./build/kvstore conf/kvstore-master.conf
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口
network proactor         # 使用 proactor 网络模型（io_uring）
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
# 推荐主机启用持久化，从机可以关闭
persistence none          # 启用 AOF 持久化（推荐生产使用）
# persistence none       # 或关闭持久化（测试用）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 全量同步
rdma_role master         # 角色：master
rdma_provider verbs        # libfabric provider（主从必须一致）
rdma_listen_port 2100    # RDMA 全量同步端口（注意：实际数据在子进程 2101 端口传输）

# Provider 选择:
#   tcp（推荐默认）:
#     - 适用于任何以太网环境，无需 RDMA 硬件
#     - 性能：40-50 MB/s
#     - 兼容性最好，开发/测试/生产通用
#
#   verbs（需要 RDMA 环境）:
#     - 适用于 InfiniBand/RoCE 硬件 或 Soft-RoCE (RXE)
#     - 性能：100+ MB/s
#     - 跨虚拟机部署时推荐（两台 VM 之间 rxe 可正常工作）
#     - 需要主从都正确配置 rxe 设备
#     - 注意：单机本地测试请勿使用 verbs，会有 RXE loopback 问题
#
#   切换方法：将 rdma_provider tcp 改为 rdma_provider verbs

# ── TCP + eBPF 增量同步配置 ───────────────────────────────────────────────
incr_repl on              # 启用增量同步
incr_repl_port 6483       # TCP 复制端口（监听此端口等待 slave 连接）

# 增量同步架构:
#   1. eBPF XDP 过滤器捕获写命令（SET/DEL/HSET 等）
#   2. 写入 64MB 复制积压缓冲区（支持断线重连增量恢复）
#   3. 通过 TCP 发送到 slave
#   4. Slave 接收后应用到本地 kvstore
#   5. 心跳线程每 3 秒发送 PING，超时断开
#
# 性能特点:
#   - eBPF 过滤：减少 60-80% 数据量（只捕获写命令）
#   - TCP 可靠性：内核自动处理重传、流控、拥塞控制
#   - 延迟：1-3ms（本地网络）
#   - 吞吐量：300-500 MB/s
#   - 自动优化：TCP_NODELAY + 2MB 缓冲区

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 设置 capabilities（推荐，替代 sudo）:
#    sudo setcap cap_bpf,cap_perfmon,cap_net_admin,cap_sys_admin+ep build/kvstore
#    然后直接运行: ./build/kvstore conf/kvstore-master.conf
#
# 2. 或直接使用 sudo（简单但有安全风险）:
#    sudo ./build/kvstore conf/kvstore-master.conf
#
# 3. 开放防火墙端口:
#    sudo ufw allow 2000/tcp  # Redis 服务
#    sudo ufw allow 2101/tcp  # RDMA 全量同步（fork 子进程）
#    sudo ufw allow 6483/tcp  # TCP 增量同步
#
# 4. 验证端口监听:
#    sudo netstat -tulnp | grep kvstore
#
# 5. 预期日志:
#    [REPL-TCP] Listening on port 6483
#    [XDP-LOAD] Attached to '<iface>', port 2000
#    [REPL-TCP] Master initialized (XDP mode) on port 6483
#    [RDMA-REPL] Session management initialized
