# =============================================================================
# kvstore-master-local.conf  —  Master 本地测试配置
#
# 用法: sudo ./build/kvstore conf/kvstore-master-local.conf
#
# 端口:
#   2000 — Redis 协议服务
#   2101 — RDMA 全量同步数据（fork 子进程，自动监听）
#   6483 — TCP 增量同步
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（本地测试用纯内存模式）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 全量同步
rdma_role master         # 角色：master
rdma_provider tcp        # ★ 本地测试必须使用 tcp（单机 verbs 有 RXE loopback 问题）
rdma_listen_port 2100    # RDMA 全量同步端口（显示用，实际数据在 2101）

# ── TCP 增量同步配置 ──────────────────────────────────────────────────────
incr_repl on             # 启用增量同步（需要 sudo/capabilities 加载 eBPF）
incr_repl_port 6483      # TCP 复制端口
