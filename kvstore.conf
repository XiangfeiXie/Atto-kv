# ============================================================
# kvstore.conf  —  KV Store runtime configuration
# Usage:  ./kvstore kvstore.conf
#         ./kvstore            (defaults to ./kvstore.conf)
# ============================================================

# ---- Network -----------------------------------------------
# Listening port
port 2000

# Network I/O model: reactor | proactor | ntyco
network proactor

# ---- Logging -----------------------------------------------
# Log level: debug | info | warn | error
loglevel debug

# ---- Replication -------------------------------------------
# Role: master | slave
mode master

# When mode is slave, uncomment and set the master address:
masterip   127.0.0.1
masterport 2040

# ---- Persistence -------------------------------------------
# Persistence model: none | rdb | aof | both
#   none  — no persistence, data is lost on restart
#   rdb   — periodic snapshot only (dump.rdb)
#   aof   — append-only log only  (appendonly.aof)
#   both  — aof preferred for load; rdb kept as backup
persistence both 

# Replication listen port (master binds; slave connects to this port on master)
replport 2001

# Storage engine: array | rbtree | hash | skiptable
engine skiptable
