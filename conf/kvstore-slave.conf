# =============================================================================
# kvstore-slave.conf  —  Slave 配置文件
#
# 功能:
#   - 提供 Redis 协议只读服务（端口 6380）
#   - 启动时通过 RDMA 从 master 拉取全量快照
#   - 运行时通过 eBPF + KCP + XDP/AF_XDP 接收增量写命令
#
# 部署:
#   - 在从机虚拟机上运行
#   - 需要 root 权限（eBPF 需要）
#   - 启动命令: sudo ./build/kvstore conf/kvstore-slave.conf
#   - 确保能连接到 master 的 IP 和端口
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口（与 master 不同）
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel info            # 日志级别: debug/info/warn/error

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 不启用持久化（纯内存模式）

# ── 线程配置 ──────────────────────────────────────────────────────────────
threads 1                # 工作线程数（单线程模式）
cpu_pin auto             # CPU 亲和性：auto 自动绑定

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync on             # 启用 RDMA 同步
rdma_role slave          # 角色：slave
rdma_provider verbs        # libfabric provider（必须与 master 一致）
rdma_master_ip 192.168.30.135   # Master IP 地址（修改为实际 master IP）
rdma_master_port 2100    # Master RDMA 端口

# 说明:
#   - rdma_master_ip 必须修改为实际 master 虚拟机的 IP 地址
#   - rdma_provider 必须与 master 保持一致（tcp 或 verbs）
#   - 启动时会自动连接 master 并拉取全量数据

# ── 增量同步配置（eBPF + KCP + XDP/AF_XDP）────────────────────────────────
xdp_repl on              # 启用增量同步
xdp_driver_mode skb      # XDP 模式: skb（通用）或 native（硬件加速）
xdp_repl_ifname ens33    # 网卡接口名（根据实际网卡修改：eth0/ens33/ens160）
xdp_repl_queue 0         # XDP 队列 ID
xdp_repl_port 6483       # Slave 本地绑定端口（同机测试时需与 master 不同）
xdp_repl_master_port 6483  # Master 的复制端口（slave 连接到此端口）
xdp_repl_zero_copy off   # AF_XDP 零拷贝: on（启用）/ off（使用 UDP）
xdp_repl_batch 64        # 批处理大小
xdp_repl_mtu 1400        # MTU 大小

# 传输方式说明:
#   【UDP 模式】(xdp_repl_zero_copy off，默认)
#     - 使用普通 UDP socket + KCP 协议（提供可靠性）
#     - Slave 绑定到 xdp_repl_port，连接到 master_ip:xdp_repl_master_port
#     - Master 从第一个数据包中自动学习 slave 地址
#     - 两台不同机器：xdp_repl_port 可与 master 相同（推荐 6483）
#     - 同一台机器测试：xdp_repl_port 必须不同（如 6484），避免端口冲突
#
#   【AF_XDP 模式】(xdp_repl_zero_copy on)
#     - 零拷贝传输，直接从网卡驱动层接收数据
#     - 不使用端口号（通过网卡队列 ID 接收）
#     - 需要网卡和内核支持，不支持时自动降级到 UDP
#     - loopback (lo) 不支持 AF_XDP


# ── 网卡配置说明 ──────────────────────────────────────────────────────────
# 查看可用网卡: ip link show
# 常见网卡名:
#   - eth0, eth1       (传统命名)
#   - ens33, ens160    (VMware)
#   - enp0s3, enp0s8   (VirtualBox)
#   - lo               (loopback，不支持 AF_XDP)
#
# 修改 xdp_repl_ifname 为实际网卡名

# ── 部署检查清单 ──────────────────────────────────────────────────────────
# 1. 修改 rdma_master_ip 为 master 虚拟机的实际 IP
# 2. 修改 xdp_repl_ifname 为实际网卡名（ip link show 查看）
# 3. 确保 master 已启动并监听 2100 端口
# 4. 确保网络连通：ping <master_ip>
# 5. 确保防火墙允许端口 2100, 6379, 6483
# 6. 使用 sudo 启动：sudo ./build/kvstore conf/kvstore-slave.conf


