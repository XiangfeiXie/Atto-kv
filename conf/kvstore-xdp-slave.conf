# =============================================================================
# kvstore-xdp-slave.conf — XDP 镜像增量同步 · Slave
#
# 配合 repl-xdp 组件使用：把 repl-xdp 从 Master 侧镜像来的写命令当普通
# 客户端命令应用（落地到本实例），与 Master 保持增量一致。
#
# 说明：
#   · repl_role off —— 增量同步完全由 XDP 镜像完成，不启用 PSYNC。
#   · 须运行在 Slave netns（slv）内，veth1 IP 10.0.1.2/24。
#   · repl-xdp 连 10.0.1.2:2001 推镜像字节。
# =============================================================================

port 2001
network proactor
maxclients 10000
persistence off
repl_role off
expire off
