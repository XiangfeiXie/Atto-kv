# =============================================================================
# kvstore-master.conf — 主从复制 · 主机（Master）配置
#
# 用于两台机器间主从同步测试，搭配 kvstore-slave.conf 使用。
# 启动:  ./build/kvstore conf/kvstore-master.conf
#
# repl_role master 同时开启：
#   · 全量同步（2 种，二选一，由 fullsync_transport 决定）：
#       RDMA          — fullsync_transport rdma       （需 RDMA 网卡 / SoftRoCE）
#       TCP sendfile  — fullsync_transport sendfile   （零拷贝，无需 RDMA）
#   · 增量同步 PSYNC（嵌入式，主端口握手 + 1MB backlog + 命令流推送）
# 传输代码保留两套：PSYNC 握手判定 +FULLRESYNC 时 fork 传输子进程，两种传输可对比性能。
# =============================================================================

# ── 服务 Service ────────────────────────────────────────────────────────────
port 2000              # 客户端连接端口（也是 Slave 的 PSYNC 握手端口，+FULLRESYNC 驱动全量）
network proactor       # 网络引擎: reactor | proactor
maxclients 10000

# ── 持久化 Persistence ──────────────────────────────────────────────────────
persistence rdb        # 主机需能 SAVE 出 RDB 供全量同步传输
aof_fsync_policy everysec

# ── 复制 Replication ────────────────────────────────────────────────────────
repl_role master       # off | master | slave（总开关）

incr_sync on           # 增量同步开关: on → PSYNC 流式; off → 仅全量
fullsync_transport sendfile   # 全量传输方式: sendfile | rdma（与 Slave 必须一致）

fullsync_listen_ip 192.168.30.137   # 全量数据端口绑定地址（RDMA CM 用，改成实际网卡 IP）
fullsync_port       2100            # 全量同步专用数据端口：sendfile 与 rdma 两种传输共用
                                    # （传输子进程 bind，Slave 的 fullsync_port 须与此一致）

# 传输方式切换（无需 RDMA 网卡则用 sendfile 即可）:
# fullsync_transport rdma

fullsync_timeout     3600000      # 全量同步超时 (ms)
fullsync_max_retries 3            # 最大重试次数

# ── 其他 Other ──────────────────────────────────────────────────────────────
expire off            # 关闭主动过期，避免干扰同步测试
# latency_histogram on   # 开启请求延迟直方图（INFO stats 输出 p50/p99/p999）
