# =============================================================================
# kvstore-dev.conf  —  开发调试配置
# =============================================================================

# ── 服务配置 ──────────────────────────────────────────────────────────────
port 2000                # Redis 协议服务端口
network proactor         # 使用 proactor 网络模型
maxclients 10000         # 最大客户端连接数
loglevel debug           # 日志级别: debug（开发调试用）

# ── 持久化配置 ────────────────────────────────────────────────────────────
persistence none         # 关闭持久化（开发调试用）

# ── RDMA 全量同步配置 ─────────────────────────────────────────────────────
rdma_sync off            # 关闭 RDMA 同步（开发调试用）

# ── TCP 增量同步配置 ──────────────────────────────────────────────────────
incr_repl off            # 关闭增量同步（开发调试用）
