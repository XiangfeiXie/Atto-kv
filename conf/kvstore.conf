# =============================================================================
# kvstore.conf  —  配置参考（列出当前解析器支持的所有配置项）
#
# 场景配置:
#   conf/kvstore-dev.conf          开发调试，关闭 IO/复制干扰
#   conf/kvstore-master.conf       主从复制主机配置
#   conf/kvstore-slave.conf        主从复制从机配置
#   conf/kvstore-master-local.conf 本地测试主机配置
#   conf/kvstore-slave-local.conf  本地测试从机配置
# =============================================================================

# =========================== Service ==========================================

# 客户端连接端口（默认: 6379，主机通常用 2000，从机用 2001）
port 2000

# 网络模型: reactor | proactor | ntyco
#   reactor   — epoll，简单稳定
#   proactor  — io_uring，高并发推荐
#   ntyco     — NtyCo 协程模型
network proactor

# 最大客户端连接数（范围: 64-65536）
maxclients 10000

# 日志级别: debug | info | warn | error
loglevel info


# =========================== Persistence ======================================

# 持久化模式: none | rdb | aof
#   none — 关闭持久化（测试/从机推荐）
#   rdb  — RDB 快照 dump.rdb
#   aof  — AOF/WAL + RDB，启动时从 wal/incr.wal replay（主机推荐）
persistence aof

# WAL fsync 策略: always | everysec | no
#   always   — 每次写入都 fsync（最安全，性能最低）
#   everysec — 每秒 fsync 一次（推荐，平衡性能和安全）
#   no       — 由操作系统决定何时 fsync（性能最高，可能丢失数据）
wal_fsync_policy everysec


# =========================== Replication ======================================

# ── RDMA 全量同步配置 ────────────────────────────────────────────────────
#
# 架构:
#   - Master: fork() + COW 快照 → 流式序列化 → libfabric 发送（1MB 分块）
#   - Slave:  libfabric 接收 → 流式反序列化 → 加载到内存
#
# 特性:
#   - 流式传输：无需预先生成完整 RDB 文件
#   - fork() + COW：子进程序列化，父进程发送，互不阻塞
#   - 性能：tcp provider 40-50 MB/s，verbs provider 100+ MB/s
#
# 启用 RDMA 全量同步（主从复制总开关）
rdma_sync off

# 角色: master | slave
rdma_role master

# libfabric provider: tcp | verbs | sockets
#   tcp     — libfabric TCP provider，兼容性好，推荐用于普通以太网
#   verbs   — RDMA 硬件加速，需要 InfiniBand/RoCE 或 Soft-RoCE
#   sockets — libfabric sockets provider
#
# 推荐配置:
#   - 开发/测试/生产（无 RDMA 硬件）: tcp
#   - 生产（有 RDMA 硬件）: verbs
rdma_provider tcp

# master: RDMA fullsync 监听地址
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# slave: RDMA fullsync 连接目标（从机配置时取消注释）
# rdma_master_ip   192.168.30.135
# rdma_master_port 2100


# ── TCP + eBPF 增量同步配置 ──────────────────────────────────────────────
#
# 架构:
#   - Master: eBPF 过滤器捕获写命令 → TCP 可靠传输 → Slave
#   - Slave:  TCP 接收 → 应用到本地 kvstore
#
# 特性:
#   - eBPF 过滤：只捕获写命令（SET/DEL/HSET 等），减少 60-80% 数据量
#   - TCP 可靠传输：内核自动处理重传、流控、拥塞控制
#   - 64MB 复制积压缓冲区：支持断线重连增量恢复
#   - 延迟：1-3ms（本地网络）
#   - 吞吐量：300-500 MB/s（取决于 TCP 调优）
#
# 启用增量复制（需要先启用 rdma_sync）
incr_repl off

# Master: TCP 复制监听端口
incr_repl_port 6483

# Slave: Master 的 TCP 复制端口（从机配置时取消注释）
# incr_repl_master_port 6483

# 注意事项:
#   1. 必须设置 BUILD_DIR 环境变量指向 build 目录（eBPF 对象文件路径）
#      export BUILD_DIR=/path/to/kvstore/build
#   2. 需要 sudo 权限或设置 capabilities:
#      sudo setcap cap_bpf,cap_perfmon,cap_net_admin,cap_sys_admin+ep kvstore
#   3. eBPF 过滤器失败时自动降级到 fallback 模式（无过滤，全量复制）




# =========================== 性能优化建议 =====================================

# TCP 网络优化（已在代码中实现）:
#   - TCP_NODELAY: 已启用，禁用 Nagle 算法，降低延迟
#   - 发送缓冲区: 2MB
#   - 接收缓冲区: 2MB
#
# 复制积压缓冲区:
#   - 大小: 64MB（代码中定义）
#   - 用途: 支持断线重连时的增量恢复
#
# eBPF 过滤效果:
#   - 流量减少: 60-80%
#   - QPS 影响: 约 4-5% 下降（可接受）


# =========================== 监控建议 =========================================

# 建议监控的指标:
#   1. 复制延迟: 比较主从 DBSIZE
#   2. 连接状态: 检查日志中的 "Connected" / "Disconnected"
#   3. 全量同步频率: 应该很少发生（仅在首次连接或长时间断线后）
#   4. 积压缓冲区使用率: 避免超过 64MB
#   5. eBPF 过滤器状态: 检查是否成功加载

# 日志关键字:
#   [RDMA-REPL] - RDMA 全量同步相关
#   [REPL-TCP]  - TCP 增量同步相关
#   [REPL-INCR] - 增量恢复相关
#   [REPL-STREAM] - 复制流相关


# =========================== 故障排查 =========================================

# 常见问题:
#
# Q1: eBPF 过滤器加载失败？
# A1: 检查 BUILD_DIR 环境变量是否设置，检查 capabilities 是否正确
#
# Q2: 从机连接超时？
# A2: 检查主机是否启动，防火墙是否开放端口 2100 和 6483，网络是否连通
#
# Q3: 数据不同步？
# A3: 检查从机日志是否显示 "Connected"，检查 eBPF 过滤器是否加载成功
#
# Q4: Ctrl+C 无法停止程序？
# A4: 已修复，等待 1-2 秒让信号处理完成
#
# Q5: verbs provider 初始化失败？
# A5: 系统没有 RDMA 硬件，改用 tcp provider
