# =============================================================================
# kvstore-slave.conf — 主从复制 · 从机（Slave）配置
#
# 用于两台机器间主从同步测试，搭配 kvstore-master.conf 使用。
# 启动:  ./build/kvstore conf/kvstore-slave.conf
#
# 全量同步（2 种，二选一，由 fullsync_transport 决定，须与 Master 一致）：
#   · RDMA          — fullsync_transport rdma       （默认，需 RDMA 网卡 / SoftRoCE）
#   · TCP sendfile  — fullsync_transport sendfile   （零拷贝，无需 RDMA）
#
# 增量同步（2 种，可独立开关）：
#   ① 嵌入式 epoll PSYNC   — incr_sync on     （本进程内，PSYNC 从 Master 拉取）
#   ② eBPF tracepoint 旁路 — 独立守护进程      （编译期配置，不在本文件）
# =============================================================================

# ── 服务 Service ────────────────────────────────────────────────────────────
port 2000              # Slave 本地监听端口（可异于 Master，互不影响）
network proactor       # 网络引擎: reactor | proactor
maxclients 10000
loglevel info

# ── 持久化 Persistence ──────────────────────────────────────────────────────
# Slave 数据来自 Master，一般无需本地持久化；如需落盘再打开 rdb/aof。
persistence none       # none | rdb | aof
aof_fsync_policy everysec

# ── 全量同步（Slave 侧）────────────────────────────────────────────────────
rdma_sync on           # 全量同步主开关
rdma_role slave        # 角色: slave

master_port       2000             # Master 主服务端口（Slave 向此端口发 FULLSYNC 握手命令）
rdma_master_ip    192.168.30.137   # Master 的 RDMA 网卡 IP（改成实际 IP）
rdma_master_port  2100             # 须等于 Master 的 rdma_listen_port
                                   #   RDMA 数据走 2100；TCP sendfile 数据走 2101（= port + 1）

# 传输方式（与 Master 的 fullsync_transport 必须一致）:
fullsync_transport sendfile           # rdma | sendfile
# fullsync_transport sendfile     # 取消注释切换为 TCP sendfile 零拷贝（无需 RDMA）

fullsync_timeout     3600000      # 全量同步超时 (ms)
fullsync_max_retries 3            # 最大重试次数

# ── 增量同步 ①：嵌入式 epoll PSYNC ─────────────────────────────────────────
incr_sync off          # 本进程内增量同步（全量完成后 PSYNC 拉取 backlog 追平）
incr_repl_port 2001   # Master 的增量同步端口（Slave 连接 Master 的此端口）

# ── 增量同步 ②：eBPF tracepoint 旁路 ───────────────────────────────────────
# 独立守护进程 kvstore-incr-sync（src/repl-incr-xdptracepoint/），编译期配置见其
# config.h（SLAVE_IP / SLAVE_PORT / KVS_FILTER_PORT / XDP_IFACE），不在本文件配置。
# 在 Master 机器上运行，Slave 侧无需额外配置。

# ── 其他 Other ──────────────────────────────────────────────────────────────
expire off            # 关闭主动过期，避免干扰同步测试
# latency_histogram on   # 开启请求延迟直方图（INFO stats 输出 p50/p99/p999）
