# =============================================================================
# kvstore-master.conf  —  主机配置
#
# 启动:  sudo ./kvstore conf/kvstore-master.conf
# =============================================================================

# ---- 服务端口 ----
port 2000

# ---- 网络模型 (reactor | proactor | ntyco) ----
network proactor

# 最大客户端连接数
maxclients 10000

# ---- 日志级别 (debug | info | warn | error) ----
loglevel info

# ---- 持久化 (none | rdb | aof) ----
persistence aof

# ---- RDMA + eBPF 主从同步 ----
rdma_sync off
rdma_role master
rdma_provider verbs

# 主机 RDMA 全量同步监听地址
rdma_listen_ip   0.0.0.0
rdma_listen_port 2100

# TCP 增量同步监听端口
incr_port 6382

# ---- XDP 热路径加速 (Phase 3 已实现: 热缓存 GET 命中 → XDP_TX 原地回包) ----
# 需要 CAP_NET_ADMIN 权限；xdp_iface 改为实际外网网卡
# 注意: 绕过内核 TCP 状态机，适用于 demo/benchmark
xdp yes
xdp_iface lo
